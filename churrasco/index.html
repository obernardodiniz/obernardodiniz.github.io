<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nosso Churrasco</title>
<meta name="description" content="A conta do churrasco: notas fiscais, convidados, custos e quanto cada um paga.">
<meta name="theme-color" content="#FBF5EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140C09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Churrasco">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Nosso Churrasco — app de celular: barra no topo, telas com transição, menu de 4 abas dentro de cada churrasco, folhas que sobem de baixo */
:root {
  --fundo: #FBF5EE;
  --cartao: #FFFFFF;
  --cartao-2: #F6ECE2;
  --tinta: #2A1711;
  --tinta-2: #7B6258;
  --tinta-3: #A8928A;
  --linha: #EEDFD2;
  --brasa: #E5501C;
  --brasa-2: #FF8A3D;
  --brasa-suave: #FFE7D8;
  --ouro: #F2A516;
  --verde: #1F8F5A;
  --verde-suave: #DCF2E6;
  --vermelho: #CF3B2B;
  --vermelho-suave: #FBE1DD;
  --vidro: rgba(251, 245, 238, .82);
  --sombra: 0 1px 2px rgba(60, 30, 15, .06), 0 10px 28px -14px rgba(60, 30, 15, .22);
  --sombra-forte: 0 24px 60px -20px rgba(60, 25, 10, .5);
  --raio: 22px;
  --raio-p: 14px;
  --f-titulo: "Bricolage Grotesque", system-ui, sans-serif;
  --f-texto: "Figtree", system-ui, -apple-system, sans-serif;
  --topo: env(safe-area-inset-top, 0px);
  --base: env(safe-area-inset-bottom, 0px);
  --mola: cubic-bezier(.2, .9, .25, 1.15);
  --suave: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #140C09;
    --cartao: #21140F;
    --cartao-2: #2C1B14;
    --tinta: #FBEFE6;
    --tinta-2: #C4A799;
    --tinta-3: #8C7268;
    --linha: #3A261D;
    --brasa-suave: #43200F;
    --verde: #4CC48A;
    --verde-suave: #143323;
    --vermelho: #FF7262;
    --vermelho-suave: #3D1611;
    --vidro: rgba(20, 12, 9, .8);
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 16px/1.45 var(--f-texto); overflow-x: hidden; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3 { font-family: var(--f-titulo); letter-spacing: -.02em; margin: 0; }
.esconder { display: none !important; }

/* Topo */
.topo { position: sticky; top: 0; z-index: 30; padding: var(--topo) 12px 0; background: var(--vidro); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.topo.rolou { border-bottom-color: var(--linha); }
.topo-dentro { max-width: 560px; margin: 0 auto; height: 58px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px; }
.topo-dentro.sem-voltar { grid-template-columns: 1fr auto; padding-left: 4px; }
.topo-titulo { display: flex; align-items: center; gap: 10px; min-width: 0; font: 700 18px/1.1 var(--f-titulo); }
.topo-titulo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo-titulo img { width: 30px; height: 30px; border-radius: 9px; }
.topo-titulo.troca { animation: tituloEntra .35s var(--suave); }
@keyframes tituloEntra { from { opacity: 0; transform: translateY(6px); } }
.topo-acoes { display: flex; gap: 4px; }
.botao-icone { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .15s; color: var(--tinta); }
.botao-icone:active { transform: scale(.9); background: var(--cartao-2); }
.botao-icone[hidden] { display: none; }

/* Telas */
main { max-width: 560px; margin: 0 auto; padding: 6px 16px calc(110px + var(--base)); overflow-x: clip; }
main.sem-abas { padding-bottom: calc(40px + var(--base)); }
#tela.entra-frente { animation: entraFrente .42s var(--suave) backwards; }
#tela.entra-tras { animation: entraTras .42s var(--suave) backwards; }
#tela.entra-lado-d { animation: ladoD .36s var(--suave) backwards; }
#tela.entra-lado-e { animation: ladoE .36s var(--suave) backwards; }
@keyframes entraFrente { from { opacity: 0; transform: translateX(28px); } }
@keyframes entraTras { from { opacity: 0; transform: translateX(-28px); } }
@keyframes ladoD { from { opacity: 0; transform: translateX(18px) scale(.99); } }
@keyframes ladoE { from { opacity: 0; transform: translateX(-18px) scale(.99); } }
.entrando .sobe { animation: sobe .5s var(--suave) both; animation-delay: calc(var(--n, 0) * 45ms + 60ms); }
@keyframes sobe { from { opacity: 0; transform: translateY(14px); } }
.recente { animation: destaque .7s var(--mola); }
@keyframes destaque { 0% { transform: scale(.94); opacity: .3; } 60% { transform: scale(1.015); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* Peças */
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px; margin-bottom: 14px; }
.secao { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 12px; }
.secao h2 { font-size: 20px; }
.secao small { color: var(--tinta-2); font-size: 14px; }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 16px; border: 0; background: var(--cartao-2); color: var(--tinta); font-weight: 650; font-size: 16px; cursor: pointer; transition: transform .15s var(--mola), filter .15s, background .15s; text-align: center; }
.botao:active { transform: scale(.96); }
.botao.primario { background: linear-gradient(135deg, var(--brasa-2), var(--brasa)); color: #fff; box-shadow: 0 10px 24px -10px rgba(229, 80, 28, .8); }
.botao.primario:active { filter: brightness(.95); }
.botao.perigo { background: var(--vermelho-suave); color: var(--vermelho); }
.botao.verde { background: var(--verde-suave); color: var(--verde); }
.botao.contorno { background: transparent; box-shadow: inset 0 0 0 1.5px var(--linha); }
.botao.largo { width: 100%; }
.botao.pequeno { min-height: 40px; padding: 0 14px; font-size: 14.5px; border-radius: 12px; }
.botao:disabled { opacity: .45; pointer-events: none; }
.linha-botoes { display: flex; gap: 10px; flex-wrap: wrap; }
.linha-botoes > * { flex: 1 1 0; }
.etiqueta { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 650; background: var(--cartao-2); color: var(--tinta-2); white-space: nowrap; }
.etiqueta.brasa { background: var(--brasa-suave); color: var(--brasa); }
.etiqueta.verde { background: var(--verde-suave); color: var(--verde); }
.etiqueta.ouro { background: #FFF1C9; color: #A86A00; }
@media (prefers-color-scheme: dark) { .etiqueta.ouro { background: #3A2B0A; color: #F7C14B; } }
.vazio { text-align: center; padding: 34px 20px; color: var(--tinta-2); }
.vazio svg.i { width: 46px; height: 46px; stroke-width: 1.4; color: var(--tinta-3); margin-bottom: 8px; }
.vazio b { display: block; color: var(--tinta); font: 700 18px var(--f-titulo); margin-bottom: 4px; }
.dica { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--raio-p); background: var(--brasa-suave); color: var(--tinta); font-size: 14.5px; margin-bottom: 14px; }
.dica svg.i { color: var(--brasa); margin-top: 1px; }
.dica .fechar-dica { margin-left: auto; width: 32px; height: 32px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--tinta-2); }
.barra { height: 10px; border-radius: 99px; background: var(--cartao-2); overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--ouro), var(--brasa)); transform-origin: left; transition: width .6s var(--suave); }
.entrando .barra i { animation: cresce .9s var(--suave) both .15s; }
@keyframes cresce { from { transform: scaleX(0); } }
.mudo { color: var(--tinta-2); }
.miudo { font-size: 13.5px; color: var(--tinta-2); }

/* Capa do início */
.capa { position: relative; overflow: hidden; border-radius: 28px; padding: 26px 22px 24px; margin: 6px 0 16px; color: #FFF3E6; background: radial-gradient(120% 90% at 85% 0%, #7A3416 0%, transparent 55%), linear-gradient(160deg, #3B2117, #160C08); box-shadow: var(--sombra-forte); }
.capa img { width: 66px; height: 66px; border-radius: 18px; box-shadow: 0 10px 30px -8px rgba(255, 122, 47, .6); animation: flutua 4s ease-in-out infinite; }
@keyframes flutua { 50% { transform: translateY(-5px) rotate(-2deg); } }
.capa h1 { font-size: 34px; line-height: 1; margin: 16px 0 6px; font-weight: 800; }
.capa h1 em { font-style: normal; background: linear-gradient(90deg, #FFD25A, #FF7A2F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.capa p { margin: 0; color: #E9CDBD; font-size: 15.5px; max-width: 30ch; }
.faiscas { position: absolute; inset: 0; pointer-events: none; }
.faiscas i { position: absolute; bottom: -10px; width: 5px; height: 5px; border-radius: 50%; background: #FFB347; box-shadow: 0 0 10px 2px rgba(255, 140, 50, .7); opacity: 0; animation: faisca 5s linear infinite; }
@keyframes faisca { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 20px), -230px) scale(.3); } }

/* Lista de churrascos */
.churrasco { display: block; position: relative; overflow: hidden; cursor: pointer; transition: transform .2s var(--mola); }
.churrasco:active { transform: scale(.98); }
.churrasco h3 { font-size: 20px; margin-bottom: 2px; padding-right: 28px; }
.churrasco .seta { position: absolute; right: 16px; top: 20px; color: var(--tinta-3); }
.churrasco .numeros { display: flex; justify-content: space-between; align-items: flex-end; margin: 14px 0 10px; }
.churrasco .numeros strong { font: 800 26px/1 var(--f-titulo); letter-spacing: -.02em; }
.passos { display: grid; gap: 10px; margin-top: 6px; }
.passo { display: flex; gap: 14px; align-items: center; }
.passo span { width: 40px; height: 40px; border-radius: 13px; background: var(--brasa-suave); color: var(--brasa); display: grid; place-items: center; flex: none; }
.passo b { display: block; font-weight: 650; }

/* Resumo */
.painel { position: relative; overflow: hidden; border-radius: 28px; padding: 22px; color: #FFF3E6; background: radial-gradient(110% 80% at 100% 0%, rgba(255, 138, 61, .55), transparent 60%), linear-gradient(150deg, #3B2117, #170D09); box-shadow: var(--sombra-forte); margin: 6px 0 14px; }
.painel .rotulo { font-size: 14px; color: #E9CDBD; font-weight: 600; }
.painel .grande { display: block; font: 800 44px/1.05 var(--f-titulo); letter-spacing: -.03em; margin: 4px 0 18px; }
.divisao { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.divisao div { background: rgba(255, 243, 230, .09); border: 1px solid rgba(255, 243, 230, .12); border-radius: 16px; padding: 12px 14px; }
.divisao small { display: block; color: #E9CDBD; font-size: 13px; font-weight: 600; }
.divisao b { font: 700 22px/1.2 var(--f-titulo); }
.painel .aviso-painel { margin-top: 14px; font-size: 14px; color: #E9CDBD; }
.grade-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.numero { background: var(--cartao); border-radius: 18px; box-shadow: var(--sombra); padding: 14px 12px; text-align: left; border: 0; cursor: pointer; transition: transform .2s var(--mola); }
.numero:active { transform: scale(.95); }
.numero svg.i { color: var(--brasa); }
.numero b { display: block; font: 800 24px/1.1 var(--f-titulo); margin-top: 8px; }
.numero small { color: var(--tinta-2); font-size: 13px; }
.cat-linha { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; }
.cat-linha .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--cartao-2); color: var(--brasa); }
.cat-linha .ic svg.i { width: 18px; height: 18px; }
.cat-linha .nome { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.cat-linha .barra { height: 7px; margin-top: 5px; }
.cat-linha .pct { font-size: 13px; color: var(--tinta-2); width: 40px; text-align: right; }
.arrecadado { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.arrecadado b { font: 800 24px var(--f-titulo); color: var(--verde); }

/* Abas de baixo */
.abas { position: fixed; z-index: 30; left: 50%; bottom: calc(12px + var(--base)); transform: translateX(-50%); width: min(528px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 24px; background: var(--vidro); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: var(--sombra-forte), inset 0 0 0 1px var(--linha); transition: transform .35s var(--suave), opacity .25s; }
.abas.fora { transform: translateX(-50%) translateY(140%); opacity: 0; pointer-events: none; }
.abas .marcador { position: absolute; top: 6px; left: 6px; bottom: 6px; width: calc((100% - 12px) / 4); border-radius: 18px; background: linear-gradient(135deg, var(--brasa-2), var(--brasa)); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .45s var(--mola); box-shadow: 0 8px 18px -8px rgba(229, 80, 28, .9); }
.abas a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 12px; font-weight: 650; color: var(--tinta-2); transition: color .25s; }
.abas a.ativa { color: #fff; }
.abas a svg.i { width: 23px; height: 23px; transition: transform .35s var(--mola); }
.abas a.ativa svg.i { transform: translateY(-1px) scale(1.06); }

/* Convidados */
.adicionar { display: grid; gap: 10px; }
.campo-linha { display: flex; gap: 8px; }
.campo-linha input { flex: 1; min-width: 0; }
.entrada, .folha input, .folha select, .folha textarea { width: 100%; min-height: 50px; padding: 12px 15px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--fundo); outline: none; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.entrada:focus, .folha input:focus, .folha select:focus, .folha textarea:focus { border-color: var(--brasa-2); box-shadow: 0 0 0 4px var(--brasa-suave); }
.folha textarea { min-height: 150px; resize: vertical; }
.escolha { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 15px; background: var(--cartao-2); }
.escolha input { position: absolute; opacity: 0; pointer-events: none; }
.escolha label, .escolha button { display: grid; place-items: center; min-height: 40px; border-radius: 11px; font-size: 14.5px; font-weight: 650; color: var(--tinta-2); cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; border: 0; background: transparent; padding: 0 6px; text-align: center; }
.escolha input:checked + label, .escolha button.sim { background: var(--cartao); color: var(--tinta); box-shadow: 0 2px 8px -2px rgba(60, 30, 15, .25); }
.resumo-tipos { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 12px; }
.lista { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; margin-bottom: 14px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--linha); min-height: 64px; transition: background .2s, opacity .3s; }
.item:last-child { border-bottom: 0; }
.item .meio { flex: 1; min-width: 0; }
.item .meio b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meio b.quebra { white-space: normal; }
.item .meio small { color: var(--tinta-2); font-size: 13.5px; }
.item .valor { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item.desligado { opacity: .5; }
.item.desligado .valor { text-decoration: line-through; }
.marca { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--tinta-3); background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; color: #fff; transition: background .2s, border-color .2s, transform .2s var(--mola); padding: 0; }
.marca svg.i { width: 18px; height: 18px; stroke-width: 2.6; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s var(--mola); }
.marca.sim { background: var(--verde); border-color: var(--verde); }
.marca.sim svg.i { opacity: 1; transform: none; }
.marca:active { transform: scale(.85); }
.marca.quadrada { border-radius: 10px; }
.marca.quadrada.sim { background: var(--brasa); border-color: var(--brasa); }
.marca:disabled { opacity: .3; }
.tipo { border: 0; cursor: pointer; padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; transition: transform .2s var(--mola); }
.tipo:active { transform: scale(.9); }
.tipo.inteira { background: var(--brasa-suave); color: var(--brasa); }
.tipo.meia { background: #FFF1C9; color: #A86A00; }
.tipo.isento { background: var(--cartao-2); color: var(--tinta-2); }
@media (prefers-color-scheme: dark) { .tipo.meia { background: #3A2B0A; color: #F7C14B; } }
.mini { width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--tinta-3); display: grid; place-items: center; cursor: pointer; flex: none; }
.mini:active { background: var(--cartao-2); }

/* Notas */
.acoes-nota { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grande-acao { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 16px; border-radius: var(--raio); border: 0; cursor: pointer; text-align: left; background: var(--cartao); box-shadow: var(--sombra); transition: transform .2s var(--mola); }
.grande-acao:active { transform: scale(.96); }
.grande-acao span { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--brasa-suave); color: var(--brasa); }
.grande-acao.principal { background: linear-gradient(150deg, var(--brasa-2), var(--brasa)); color: #fff; box-shadow: 0 14px 30px -14px rgba(229, 80, 28, .9); }
.grande-acao.principal span { background: rgba(255, 255, 255, .2); color: #fff; }
.grande-acao b { font: 700 17px/1.15 var(--f-titulo); }
.grande-acao small { font-size: 13px; opacity: .8; margin-top: -6px; }
.nota-cartao { display: flex; gap: 14px; align-items: center; cursor: pointer; transition: transform .2s var(--mola); }
.nota-cartao:active { transform: scale(.98); }
.miniatura { width: 58px; height: 72px; border-radius: 12px; background: var(--cartao-2) center/cover no-repeat; flex: none; display: grid; place-items: center; color: var(--tinta-3); }
.nota-cartao .meio { flex: 1; min-width: 0; }
.nota-cartao b { display: block; font: 700 17px/1.2 var(--f-titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foto-nota { position: relative; border-radius: var(--raio); overflow: hidden; background: var(--cartao-2); margin-bottom: 14px; max-height: 260px; cursor: zoom-in; box-shadow: var(--sombra); }
.foto-nota img { width: 100%; display: block; object-fit: cover; object-position: top; max-height: 260px; }
.foto-nota .lupa { position: absolute; right: 12px; bottom: 12px; padding: 6px 12px; border-radius: 99px; background: rgba(20, 12, 9, .7); color: #fff; font-size: 13px; font-weight: 650; display: flex; gap: 6px; align-items: center; }
.foto-nota .lupa svg.i { width: 16px; height: 16px; }
.fixo-soma { position: sticky; top: calc(58px + var(--topo)); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; margin: 0 -4px 12px; border-radius: 18px; background: var(--tinta); color: var(--fundo); box-shadow: var(--sombra-forte); }
.fixo-soma b { font: 800 22px var(--f-titulo); }

.folha { position: fixed; inset: 0; z-index: 50; }

<script>
"use strict";
/* ========= Utilidades ========= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = (nome, cls = "") => `<svg class="i ${cls}"><use href="#i-${nome}"/></svg>`;
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const din = (c) => BRL.format((c || 0) / 100);
// Dinheiro é sempre guardado em centavos (número inteiro).
function centavos(s) {
  s = String(s ?? "").replace(/[^\d,.-]/g, "");
  if (!s) return 0;
  const i = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  let inteiro = s, dec = "00";
  if (i >= 0 && s.length - i - 1 <= 2) { inteiro = s.slice(0, i); dec = s.slice(i + 1).padEnd(2, "0"); }
  inteiro = inteiro.replace(/\D/g, "") || "0";
  return parseInt(inteiro, 10) * 100 + parseInt(dec.replace(/\D/g, "") || "0", 10);
}
const paraCampo = (c) => (c ? (c / 100).toFixed(2).replace(".", ",") : "");
const numero = (s) => { const n = parseFloat(String(s ?? "").replace(",", ".")); return isFinite(n) && n > 0 ? n : 1; };
const qtdTexto = (n) => String(Math.round(n * 1000) / 1000).replace(".", ",");
function dataCurta(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  return new Date(a, m - 1, d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" }).replace(/\./g, "");
}
function dataLonga(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  return new Date(a, m - 1, d).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const tituloCaso = (s) => s.toLowerCase().replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

/* ========= Dados (ficam só neste aparelho) ========= */
const CHAVE = "nosso-churrasco";
let estado = carregar();
function carregar() {
  try { const e = JSON.parse(localStorage.getItem(CHAVE)); if (e && Array.isArray(e.churrascos)) return e; } catch (e) {}
  return { versao: 1, churrascos: [] };
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
  catch (e) { avisar("Não consegui salvar: a memória do navegador está cheia.", "alerta"); }
}
const pref = {
  ler(k) { try { return localStorage.getItem("nc-" + k); } catch (e) { return null; } },
  por(k, v) { try { localStorage.setItem("nc-" + k, v); } catch (e) {} },
};
// Fotos das notas: no banco do navegador (IndexedDB), que aguenta arquivos grandes.
const fotos = {
  _bd: null, _urls: new Map(),
  abrir() {
    return this._bd ||= new Promise((ok, erro) => {
      const r = indexedDB.open("nosso-churrasco", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fotos");
      r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
    });
  },
  async _fazer(modo, f) {
    const bd = await this.abrir();
    return new Promise((ok, erro) => { const t = bd.transaction("fotos", modo); const r = f(t.objectStore("fotos")); t.oncomplete = () => ok(r && r.result); t.onerror = () => erro(t.error); });
  },
  por(id, blob) { this._urls.delete(id); return this._fazer("readwrite", (s) => s.put(blob, id)); },
  pegar(id) { return this._fazer("readonly", (s) => s.get(id)); },
  tirar(id) { if (!id) return; const u = this._urls.get(id); if (u) URL.revokeObjectURL(u); this._urls.delete(id); return this._fazer("readwrite", (s) => s.delete(id)).catch(() => {}); },
  limpar() { this._urls.clear(); return this._fazer("readwrite", (s) => s.clear()); },
  async url(id) {
    if (!id) return null;
    if (this._urls.has(id)) return this._urls.get(id);
    const b = await this.pegar(id).catch(() => null);
    if (!b) return null;
    const u = URL.createObjectURL(b); this._urls.set(id, u); return u;
  },
};
async function mostrarFotos() {
  for (const el of document.querySelectorAll("[data-foto]")) {
    const u = await fotos.url(el.dataset.foto);
    if (!u) continue;
    if (el.tagName === "IMG") el.src = u; else { el.style.backgroundImage = `url("${u}")`; el.innerHTML = ""; }
  }
}

const CATEGORIAS = [
  { id: "churrasqueira", nome: "Churrasqueira", icone: "grelha", dica: "Aluguel da churrasqueira" },
  { id: "churrasqueiro", nome: "Churrasqueiro", icone: "chef", dica: "Diária do churrasqueiro" },
  { id: "musico", nome: "Músico", icone: "musica", dica: "Som ao vivo, DJ, caixa de som" },
  { id: "tenda", nome: "Tendas", icone: "tenda", dica: "Aluguel de tenda" },
  { id: "comida", nome: "Comidas", icone: "comida", dica: "Carnes, acompanhamentos, sobremesa" },
  { id: "bebida", nome: "Bebidas", icone: "bebida", dica: "Cerveja, refrigerante, água" },
  { id: "carvao", nome: "Carvão e gelo", icone: "saco", dica: "Carvão, gelo, sal grosso" },
  { id: "local", nome: "Local", icone: "local", dica: "Aluguel do espaço" },
  { id: "garcom", nome: "Garçom", icone: "garcom", dica: "Garçom, ajudante, limpeza" },
  { id: "mesas", nome: "Mesas e cadeiras", icone: "mesa", dica: "Aluguel de mesas e cadeiras" },
  { id: "descartaveis", nome: "Descartáveis", icone: "copo", dica: "Pratos, copos, talheres, guardanapos" },
  { id: "outro", nome: "Outro custo", icone: "etiqueta", dica: "Qualquer outro gasto" },
];
const categoria = (id) => CATEGORIAS.find((c) => c.id === id) || CATEGORIAS[CATEGORIAS.length - 1];
const TIPOS = { inteira: "Inteira", meia: "Meia", isento: "Não paga" };
const PROXIMO_TIPO = { inteira: "meia", meia: "isento", isento: "inteira" };

const achar = (id) => estado.churrascos.find((c) => c.id === id);
const somaNota = (n) => n.itens.reduce((s, i) => s + (i.usar ? i.valor : 0), 0);
const totalLido = (n) => n.itens.reduce((s, i) => s + i.valor, 0);
function contas(c) {
  const notas = c.notas.reduce((s, n) => s + somaNota(n), 0);
  const custos = c.custos.reduce((s, k) => s + Math.round(k.valor * k.qtd), 0);
  const total = notas + custos;
  const inteiras = c.convidados.filter((g) => g.tipo === "inteira").length;
  const meias = c.convidados.filter((g) => g.tipo === "meia").length;
  // Quem paga meia conta como metade de uma pessoa. Arredonda para cima no centavo, para nunca faltar.
  const partes = inteiras * 2 + meias;
  const meia = partes ? Math.ceil(total / partes) : 0;
  const inteira = meia * 2;
  const deve = (g) => (g.tipo === "inteira" ? inteira : g.tipo === "meia" ? meia : 0);
  const pagantes = c.convidados.filter((g) => g.tipo !== "isento");
  const esperado = pagantes.reduce((s, g) => s + deve(g), 0);
  const recebido = pagantes.filter((g) => g.pagou).reduce((s, g) => s + deve(g), 0);
  return { notas, custos, total, inteiras, meias, isentos: c.convidados.length - inteiras - meias, meia, inteira, deve, pagantes, esperado, recebido, faltam: pagantes.filter((g) => !g.pagou) };
}

/* ========= Rotas e telas ========= */
const ABAS = ["resumo", "convidados", "notas", "custos"];
let ultimaChave = null, ultimaOrdem = 0, recentes = new Set(), filtroConvidados = "todos", contarAoEntrar = false;
function rota() { return location.hash.replace(/^#\/?/, "").split("/").filter(Boolean); }
function ir(caminho) { location.hash = "#/" + caminho; }

function montarTela(p) {
  if (!p.length) return telaInicio();
  if (p[0] === "ajustes") return telaAjustes();
  if (p[0] === "c") {
    const c = achar(p[1]);
    if (!c) return null;
    if (p[2] === "nota") { const n = c.notas.find((x) => x.id === p[3]); return n ? telaNota(c, n) : null; }
    const aba = ABAS.includes(p[2]) ? p[2] : "resumo";
    return { resumo: telaResumo, convidados: telaConvidados, notas: telaNotas, custos: telaCustos }[aba](c);
  }
  return null;
}

function render() {
  const p = rota();
  const v = montarTela(p);
  if (!v) { if (location.hash !== "#/" && location.hash !== "") { location.replace("#/"); } else if (!p.length) { /* nada */ } return; }
  const chave = p.join("/");
  const mudou = chave !== ultimaChave;
  // Título e botões do topo
  const t = $("#titulo");
  const novoTitulo = v.titulo;
  if (t.dataset.t !== novoTitulo) { t.innerHTML = novoTitulo; t.dataset.t = novoTitulo; t.classList.remove("troca"); void t.offsetWidth; t.classList.add("troca"); }
  $("#btVoltar").hidden = v.voltar == null;
  $(".topo-dentro").classList.toggle("sem-voltar", v.voltar == null);
  $("#btVoltar").dataset.para = v.voltar || "";
  $("#acoesTopo").innerHTML = v.acoes || "";
  // Abas de baixo
  const abas = $("#abas");
  if (v.aba) {
    abas.classList.remove("fora");
    abas.style.setProperty("--i", ABAS.indexOf(v.aba));
    abas.querySelectorAll("a").forEach((a) => { a.href = `#/c/${v.churrasco}/${a.dataset.aba}`; a.classList.toggle("ativa", a.dataset.aba === v.aba); });
  } else abas.classList.add("fora");
  $("#principal").classList.toggle("sem-abas", !v.aba);
  // Conteúdo, com transição quando muda de tela
  const tela = $("#tela");
  tela.innerHTML = v.html;
  if (mudou) {
    const ordem = v.ordem;
    let classe = "entra-frente";
    if (ultimaChave !== null) {
      if (Math.floor(ordem / 10) === Math.floor(ultimaOrdem / 10) && ordem !== ultimaOrdem && Math.floor(ordem / 10) === 1) classe = ordem > ultimaOrdem ? "entra-lado-d" : "entra-lado-e";
      else if (ordem < ultimaOrdem) classe = "entra-tras";
    }
    tela.className = "";
    void tela.offsetWidth;
    tela.className = classe + " entrando";
    clearTimeout(render._t);
    render._t = setTimeout(() => tela.classList.remove("entrando"), 900);
    window.scrollTo(0, 0);
    ultimaChave = chave; ultimaOrdem = ordem;
    contarAoEntrar = true;
  }
  for (const id of recentes) { const el = tela.querySelector(`[data-linha="${id}"]`); if (el) el.classList.add("recente"); }
  recentes.clear();
  mostrarFotos();
  if (contarAoEntrar) { contarNumeros(); contarAoEntrar = false; }
  if (v.depois) v.depois();
}
function contarNumeros() {
  document.querySelectorAll("[data-conta]").forEach((el) => {
    const fim = +el.dataset.conta; if (!fim) return;
    const t0 = performance.now(), dur = 700;
    const passo = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = din(Math.round(fim * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
const logoTitulo = `<img src="img/logo.svg" alt=""><span>Nosso Churrasco</span>`;
const btTopo = (acao, icone, rotulo, extra = "") => `<button class="botao-icone" data-acao="${acao}" ${extra} aria-label="${rotulo}" title="${rotulo}">${ic(icone)}</button>`;

/* ----- Início ----- */
function telaInicio() {
  const lista = [...estado.churrascos].sort((a, b) => (b.data || "").localeCompare(a.data || "") || b.criadoEm - a.criadoEm);
  const faiscas = Array.from({ length: 14 }, (_, i) => `<i style="left:${(i * 7.3 + 3) % 100}%;animation-delay:${(i * 0.37) % 5}s;--dx:${(i % 2 ? 1 : -1) * (10 + (i * 7) % 30)}px"></i>`).join("");
  let html = `<section class="capa sobe"><div class="faiscas">${faiscas}</div><img src="img/logo.svg" alt="Logo do Nosso Churrasco"><h1>Nosso<br><em>Churrasco</em></h1><p>As notas, os convidados e a conta dividida, tudo num lugar só.</p></section>`;
  if (!instalado() && !pref.ler("dica-instalar")) html += `<div class="dica sobe" style="--n:1">${ic("celular")}<div><b>Ponha na tela do celular</b><br><a href="#/ajustes" style="text-decoration:underline">Ver como instalar o app</a></div><button class="fechar-dica" data-acao="fecharDicaInstalar" aria-label="Fechar">${ic("x")}</button></div>`;
  html += `<button class="botao primario largo sobe" style="--n:2" data-acao="novoChurrasco">${ic("mais")} Novo churrasco</button>`;
  if (!lista.length) {
    html += `<div class="cartao sobe" style="--n:3;margin-top:16px"><h3 style="margin-bottom:12px">Como funciona</h3><div class="passos">
      <div class="passo"><span>${ic("camera")}</span><div><b>Fotografe as notinhas</b><small class="mudo">O app lê os itens e você marca o que foi para o churrasco.</small></div></div>
      <div class="passo"><span>${ic("moedas")}</span><div><b>Some os outros custos</b><small class="mudo">Churrasqueiro, músico, tenda, gelo, local…</small></div></div>
      <div class="passo"><span>${ic("pessoas")}</span><div><b>Liste os convidados</b><small class="mudo">Quem paga inteira, quem paga meia e quem não paga.</small></div></div>
      <div class="passo"><span>${ic("compartilhar")}</span><div><b>Mande a conta no WhatsApp</b><small class="mudo">E vá marcando quem já pagou.</small></div></div></div></div>`;
  } else {
    html += `<div class="secao"><h2>Seus churrascos</h2><small>${plural(lista.length, "churrasco", "churrascos")}</small></div>`;
    lista.forEach((c, i) => {
      const k = contas(c);
      const pct = k.esperado ? Math.round((k.recebido / k.esperado) * 100) : 0;
      html += `<a class="cartao churrasco sobe" style="--n:${i + 3}" href="#/c/${c.id}">
        <h3>${esc(c.nome)}</h3>${ic("seta", "seta")}
        <div class="miudo">${c.data ? esc(dataCurta(c.data)) : "Sem data"}${c.local ? " · " + esc(c.local) : ""}</div>
        <div class="numeros"><div><small class="miudo">Total</small><br><strong>${din(k.total)}</strong></div><div style="text-align:right"><span class="etiqueta">${plural(c.convidados.length, "convidado", "convidados")}</span></div></div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <div class="miudo" style="margin-top:6px">${k.pagantes.length ? `${din(k.recebido)} recebidos de ${din(k.esperado)}` : "Ninguém na lista ainda"}</div></a>`;
    });
  }
  html += `<p class="rodape">Os dados ficam guardados só neste aparelho.</p>`;
  return { titulo: logoTitulo, ordem: 0, html, acoes: btTopo("irAjustes", "ajustes", "Ajustes") };
}

/* ----- Resumo do churrasco ----- */
function telaResumo(c) {
  const k = contas(c);
  const pagam = k.inteiras + k.meias;
  let html = `<section class="painel sobe"><div class="faiscas">${Array.from({ length: 8 }, (_, i) => `<i style="left:${(i * 13 + 5) % 100}%;animation-delay:${(i * 0.6) % 5}s;--dx:${(i % 2 ? 1 : -1) * 18}px"></i>`).join("")}</div>
    <span class="rotulo">Total do churrasco</span><strong class="grande" data-conta="${k.total}">${din(k.total)}</strong>
    ${pagam ? `<div class="divisao"><div><small>Inteira</small><b data-conta="${k.inteira}">${din(k.inteira)}</b></div><div><small>Meia</small><b data-conta="${k.meia}">${din(k.meia)}</b></div></div>` : `<div class="aviso-painel">Coloque os convidados para o app dividir a conta.</div>`}
    ${pagam ? `<div class="aviso-painel">${k.inteiras} inteira${k.inteiras === 1 ? "" : "s"} e ${k.meias} meia${k.meias === 1 ? "" : "s"}${k.isentos ? ` · ${k.isentos} não paga${k.isentos === 1 ? "" : "m"}` : ""}</div>` : ""}</section>
    <div class="grade-3">
      <button class="numero sobe" style="--n:1" data-acao="irAba" data-aba="convidados">${ic("pessoas")}<b>${c.convidados.length}</b><small>convidados</small></button>
      <button class="numero sobe" style="--n:2" data-acao="irAba" data-aba="notas">${ic("nota")}<b>${c.notas.length}</b><small>notas</small></button>
      <button class="numero sobe" style="--n:3" data-acao="irAba" data-aba="custos">${ic("moedas")}<b>${c.custos.length}</b><small>custos extras</small></button>
    </div>`;
  if (k.pagantes.length) {
    const pct = k.esperado ? Math.round((k.recebido / k.esperado) * 100) : 0;
    html += `<div class="cartao sobe" style="--n:4"><div class="arrecadado"><div><small class="miudo">Já recebido</small><br><b>${din(k.recebido)}</b></div><span class="etiqueta ${pct === 100 ? "verde" : "brasa"}">${pct}%</span></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <p class="miudo" style="margin:10px 0 12px">${k.faltam.length ? `Faltam ${din(k.esperado - k.recebido)} de ${plural(k.faltam.length, "pessoa", "pessoas")}: ${esc(k.faltam.slice(0, 4).map((g) => g.nome).join(", "))}${k.faltam.length > 4 ? "…" : ""}` : "Todo mundo pagou. 🎉"}</p>
      ${k.faltam.length ? `<button class="botao pequeno contorno largo" data-acao="verQuemFalta">Ver quem falta pagar</button>` : ""}</div>`;
  }
  // Para onde foi o dinheiro
  const partes = [];
  c.notas.forEach((n) => { const v = somaNota(n); if (v) partes.push({ nome: n.loja || "Nota fiscal", icone: "nota", valor: v }); });
  const porCat = {};
  c.custos.forEach((x) => { porCat[x.categoria] = (porCat[x.categoria] || 0) + Math.round(x.valor * x.qtd); });
  Object.entries(porCat).forEach(([id, v]) => { const cat = categoria(id); partes.push({ nome: cat.nome, icone: cat.icone, valor: v }); });
  partes.sort((a, b) => b.valor - a.valor);
  if (partes.length) {
    html += `<div class="cartao sobe" style="--n:5"><h3 style="margin-bottom:14px">Para onde foi o dinheiro</h3>`;
    partes.forEach((x) => {
      const pct = k.total ? (x.valor / k.total) * 100 : 0;
      html += `<div class="cat-linha"><span class="ic">${ic(x.icone)}</span><div><div class="nome"><span>${esc(x.nome)}</span><span>${din(x.valor)}</span></div><div class="barra"><i style="width:${pct.toFixed(1)}%"></i></div></div><span class="pct">${Math.round(pct)}%</span></div>`;
    });
    html += `</div>`;
  }
  if (c.data || c.local || c.pix) {
    html += `<div class="cartao sobe" style="--n:6">`;
    if (c.data) html += `<div class="item" style="padding:6px 0;min-height:0;border:0">${ic("calendario")}<div class="meio"><b class="quebra">${esc(dataLonga(c.data))}</b></div></div>`;
    if (c.local) html += `<div class="item" style="padding:6px 0;min-height:0;border:0">${ic("local")}<div class="meio"><b class="quebra">${esc(c.local)}</b></div></div>`;
    if (c.pix) html += `<div class="item" style="padding:6px 0;min-height:0;border:0">${ic("pix")}<div class="meio"><b class="quebra">Pix: ${esc(c.pix)}</b></div><button class="mini" data-acao="copiarPix" aria-label="Copiar Pix">${ic("nota")}</button></div>`;
    html += `</div>`;
  }
  html += `<div class="sobe" style="--n:7;display:grid;gap:10px;margin-top:6px">
    <button class="botao primario largo" data-acao="compartilhar">${ic("compartilhar")} Mandar a conta no WhatsApp</button>
    <div class="linha-botoes"><button class="botao" data-acao="editarChurrasco">${ic("lapis")} Editar</button><button class="botao perigo" data-acao="excluirChurrasco">${ic("lixo")} Excluir</button></div></div>`;
  return { titulo: `<span>${esc(c.nome)}</span>`, voltar: "", ordem: 10, aba: "resumo", churrasco: c.id, html, acoes: btTopo("compartilhar", "compartilhar", "Compartilhar") };
}

/* ========= Folha que sobe de baixo ========= */
let aoFecharFolha = null;
function abrirFolha(html, depois) {
  const f = $("#folha");
  clearTimeout(fecharFolha._t);
  $("#folhaConteudo").innerHTML = html;
  f.hidden = false; f.style.removeProperty("--arrasto");
  requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add("aberta")));
  if (depois) depois($("#folhaConteudo"));
}
function fecharFolha() {
  const f = $("#folha");
  if (f.hidden) return;
  f.classList.remove("aberta");
  clearTimeout(fecharFolha._t);
  fecharFolha._t = setTimeout(() => { f.hidden = true; $("#folhaConteudo").innerHTML = ""; }, 420);
  const cb = aoFecharFolha; aoFecharFolha = null; if (cb) cb();
}
function confirmar(titulo, texto, botao = "Sim, excluir") {
  return new Promise((ok) => {
    abrirFolha(`<h2>${esc(titulo)}</h2><p class="sub">${esc(texto)}</p><div class="linha-botoes"><button class="botao" data-acao="fecharFolha">Cancelar</button><button class="botao perigo" data-acao="confirmaSim">${esc(botao)}</button></div>`);
    aoFecharFolha = () => ok(false);
    confirmar._sim = () => { aoFecharFolha = null; fecharFolha(); ok(true); };
  });
}
// Arrastar a folha para baixo fecha
(() => {
  const caixa = $(".folha-caixa"), f = $("#folha");
  let y0 = null, dy = 0;
  caixa.addEventListener("touchstart", (e) => { if (caixa.scrollTop > 0 || e.target.closest("input,textarea,select")) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  caixa.addEventListener("touchmove", (e) => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 4) { f.classList.add("arrastando"); f.style.setProperty("--arrasto", dy + "px"); } }, { passive: true });
  caixa.addEventListener("touchend", () => { if (y0 === null) return; f.classList.remove("arrastando"); f.style.removeProperty("--arrasto"); if (dy > 110) fecharFolha(); y0 = null; });
})();

/* ========= Avisos e festa ========= */
function avisar(texto, icone = "check") {
  const a = $("#aviso");
  a.innerHTML = ic(icone) + `<span>${esc(texto)}</span>`;
  a.classList.add("mostra");
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => a.classList.remove("mostra"), 2800);
}
function festa() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const f = document.createElement("div"); f.className = "festa";
  const cores = ["#FFD25A", "#FF8A3D", "#E5501C", "#FFB347", "#1F8F5A"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    p.style.left = 50 + (Math.random() - 0.5) * 30 + "%";
    p.style.background = cores[i % cores.length];
    p.style.setProperty("--dx", (Math.random() - 0.5) * 420 + "px");
    p.style.setProperty("--dy", -(260 + Math.random() * 480) + "px");
    p.style.animationDelay = Math.random() * 0.25 + "s";
    f.appendChild(p);
  }
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 2400);
}

const formularios = {
  salvarChurrasco(f, dados) {
    const p = rota();
    const existente = p[0] === "c" ? achar(p[1]) : null;
    const nome = dados.get("nome").trim();
    if (!nome) return;
    if (existente) {
      Object.assign(existente, { nome, data: dados.get("data"), local: dados.get("local").trim(), pix: dados.get("pix").trim() });
      salvar(); fecharFolha(); render(); avisar("Churrasco atualizado");
    } else {
      const c = { id: novoId(), nome, data: dados.get("data"), local: dados.get("local").trim(), pix: dados.get("pix").trim(), criadoEm: Date.now(), convidados: [], notas: [], custos: [] };
      estado.churrascos.push(c); salvar(); fecharFolha(); ir(`c/${c.id}`); avisar("Churrasco criado! Bora organizar.", "fogo");
    }
  },
  novoConvidado(f, dados) {
    const c = achar(rota()[1]);
    const nome = dados.get("nome").trim();
    const tipo = dados.get("tipo") || "inteira";
    pref.por("tipo-novo", tipo);
    if (!nome) { f.nome.focus(); return; }
    if (c.convidados.some((g) => g.nome.toLowerCase() === nome.toLowerCase())) { avisar(`${nome} já está na lista`, "alerta"); f.nome.select(); return; }
    const g = { id: novoId(), nome, tipo, pagou: false };
    c.convidados.push(g); salvar(); recentes.add(g.id);
    if (filtroConvidados === "pagou") filtroConvidados = "todos";
    render();
    const campo = $("#novoNome"); if (campo) campo.focus();
    avisar(`${nome} entrou na lista`);
  },
  salvarConvidado(f, dados) {
    const c = achar(rota()[1]);
    const g = c.convidados.find((x) => x.id === f.dataset.id);
    g.nome = dados.get("nome").trim() || g.nome; g.tipo = dados.get("tipo");
    if (g.tipo === "isento") g.pagou = false;
    salvar(); fecharFolha(); recentes.add(g.id); render();
  },
  colarLista(f, dados) {
    const c = achar(rota()[1]);
    const tipo = dados.get("tipo") || "inteira";
    const ja = new Set(c.convidados.map((g) => g.nome.toLowerCase()));
    let n = 0;
    dados.get("lista").split(/\r?\n|;/).forEach((l) => {
      const nome = l.replace(/^[\s\-–•*·\d.)]+/, "").replace(/\s+/g, " ").trim();
      if (nome.length < 2 || ja.has(nome.toLowerCase())) return;
      ja.add(nome.toLowerCase());
      const g = { id: novoId(), nome: nome.slice(0, 60), tipo, pagou: false };
      c.convidados.push(g); recentes.add(g.id); n++;
    });
    salvar(); fecharFolha(); render();
    avisar(n ? `${plural(n, "pessoa entrou", "pessoas entraram")} na lista` : "Nenhum nome novo na lista", n ? "check" : "alerta");
  },
  salvarCusto(f, dados) {
    const c = achar(rota()[1]);
    const valor = centavos(dados.get("valor"));
    if (!valor) { avisar("Coloque o valor", "alerta"); f.valor.focus(); return; }
    const reg = { categoria: f.dataset.cat, descricao: dados.get("descricao").trim(), qtd: numero(dados.get("qtd")), valor };
    let id = f.dataset.id;
    if (id) Object.assign(c.custos.find((x) => x.id === id), reg);
    else { id = novoId(); c.custos.push({ id, ...reg }); }
    salvar(); fecharFolha(); recentes.add(id); render();
    avisar(f.dataset.id ? "Custo atualizado" : `${categoria(reg.categoria).nome}: ${din(Math.round(reg.valor * reg.qtd))}`);
  },
  salvarItem(f, dados) {
    const p = rota(); const c = achar(p[1]); const n = c.notas.find((x) => x.id === p[3]);
    const valor = centavos(dados.get("valor"));
    const reg = { nome: dados.get("nome").trim(), qtd: dados.get("qtd").trim(), valor };
    let id = f.dataset.id;
    if (id) Object.assign(n.itens.find((x) => x.id === id), reg);
    else { id = novoId(); n.itens.push({ id, usar: true, ...reg }); }
    salvar(); fecharFolha(); recentes.add(id); render();
  },
  salvarNota(f, dados) {
    const p = rota(); const c = achar(p[1]);
    const reg = { loja: dados.get("loja").trim(), data: dados.get("data"), total: centavos(dados.get("total")) };
    if (f.dataset.nova) {
      const n = { id: novoId(), criadoEm: Date.now(), fotoId: null, itens: [], ...reg };
      c.notas.push(n); salvar(); fecharFolha(); ir(`c/${c.id}/nota/${n.id}`);
      setTimeout(() => folhaItem(n, null), 500);
    } else {
      Object.assign(c.notas.find((x) => x.id === p[3]), reg); salvar(); fecharFolha(); render();
    }
  },
};

/* ========= Ações dos botões ========= */
const acoes = {
  voltar(el) { ir(el.dataset.para || ""); },
  irAjustes() { ir("ajustes"); },
  irAba(el) { ir(`c/${rota()[1]}/${el.dataset.aba}`); },
  fecharFolha() { fecharFolha(); },
  confirmaSim() { confirmar._sim && confirmar._sim(); },
  fecharDicaInstalar() { pref.por("dica-instalar", "1"); render(); },
  novoChurrasco() { folhaChurrasco(null); },
  editarChurrasco() { folhaChurrasco(achar(rota()[1])); },
  async excluirChurrasco() {
    const c = achar(rota()[1]);
    if (!(await confirmar(`Excluir “${c.nome}”?`, "Some com convidados, notas, fotos e custos deste churrasco. Não dá para desfazer."))) return;
    c.notas.forEach((n) => fotos.tirar(n.fotoId));

/* ========= Leitura da foto da nota ========= */
let leitor = null, aoProgresso = null;
function carregarScript(src) {
  return new Promise((ok, erro) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => erro(new Error("sem internet")); document.head.appendChild(s); });
}
async function prepararLeitor() {
  if (leitor) return leitor;
  if (!window.Tesseract) await carregarScript("vendor/tesseract/tesseract.min.js");
  const base = new URL("vendor/tesseract/", location.href).href;
  leitor = await Tesseract.createWorker("por", 1, {
    workerPath: base + "worker.min.js", corePath: base, langPath: base + "lang",
    logger: (m) => aoProgresso && aoProgresso(m),
  });
  await leitor.setParameters({ tessedit_pageseg_mode: "4", preserve_interword_spaces: "1" });
  return leitor;
}
async function abrirImagem(arquivo) {
  try { return await createImageBitmap(arquivo, { imageOrientation: "from-image" }); }
  catch (e) {
    return await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error("imagem")); i.src = URL.createObjectURL(arquivo); });
  }
}
// Deixa a foto boa para ler: tamanho certo, cinza e com contraste esticado.
function imagemParaLeitura(img) {
  const w0 = img.width, h0 = img.height;
  let k = 1700 / w0;
  k = Math.max(0.25, Math.min(2.5, k));
  if (h0 * k > 6000) k = 6000 / h0;
  const w = Math.round(w0 * k), h = Math.round(h0 * k);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h), px = d.data;
  const hist = new Uint32Array(256);
  for (let i = 0; i < px.length; i += 4) { const v = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000 | 0; px[i] = v; hist[v]++; }
  const n = w * h; let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > n * 0.02) { lo = v; break; } }
  acc = 0; for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * 0.02) { hi = v; break; } }
  const amp = Math.max(1, hi - lo);
  for (let i = 0; i < px.length; i += 4) { let v = ((px[i] - lo) * 255) / amp; v = v < 0 ? 0 : v > 255 ? 255 : v; px[i] = px[i + 1] = px[i + 2] = v; }
  cx.putImageData(d, 0, 0);
  return cv;
}
function fotoParaGuardar(img) {
  const k = Math.min(1, 1500 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise((ok) => cv.toBlob((b) => ok(b), "image/jpeg", 0.8));
}

// Transforma o texto lido em itens. Funciona com as notas de mercado mais comuns (NFC-e / cupom).
const PRECO = /(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\s?\d{2}|\d+[.,]\s?\d{2})(?:\s+[A-Z]{1,2}\d{0,2})?\s*$/i;
const QTD = /(\d+(?:[.,]\d{1,3})?)\s*(UN|UND|UNID|KG|PC|PCT|CX|LT|L|G|FD|DZ|BD|M)?\s*[xX×*]\s*(?:R\$\s*)?(\d+[.,]\d{2,3})/i;
const QTD_SEM_X = /(\d+(?:[.,]\d{1,3})?)\s*(UN|UND|UNID|KG|PC|PCT|CX|LT|FD|DZ|BD)\s+(?:R\$\s*)?(\d+[.,]\d{2,3})\s*$/i;
const IGNORAR =/(SUB\s*-?\s*TOTAL|TOTAL|TROCO|DINHEIRO|CART[AÃ]O|CR[EÉ]DITO|D[EÉ]BITO|\bPIX\b|DESCONTO|ACR[EÉ]SCIMO|VALOR\s*(PAGO|A\s*PAGAR|RECEBIDO|APROX)|TRIBUTO|IMPOSTO|CNPJ|\bCPF\b|ICMS|INSCRI|CONSUMIDOR|PROTOCOLO|CHAVE\s*DE|S[EÉ]RIE|EMISS[AÃ]O|NFC|DANFE|FORMA\s*(DE\s*)?PAG|QTD\.?\s*(TOTAL|ITENS)|LEI\s*\d|FEDERAL|ESTADUAL|MUNICIPAL|OPERADOR|VOLUMES|VIA\s*CONSUMIDOR|CONSULTE|DOCUMENTO\s*AUXILIAR)/i;
const letras = (s) => (s.match(/\p{L}/gu) || []).length;
function limparNome(s) {
  return s.replace(/^\s*\d{1,3}[\s.)-]+/, "")
    .replace(/\b\d{4,14}\b/g, " ")
    .replace(/\s(UN|UND|KG|PC|CX|LT)\s*$/i, "")
    .replace(/[^\p{L}\p{N}\s%.,/+-]/gu, " ")
    .replace(/\s+/g, " ").replace(/^[\s.,-]+|[\s.,-]+$/g, "").trim();
}
// Nome da loja: linha do começo que parece texto de verdade (e não sujeira da borda da foto nem endereço).
function pontoLoja(linha) {
  if (IGNORAR.test(linha) || /(\b(RUA|AV|AVENIDA|CEP|TEL|FONE|ESTRADA|ROD|TRAVESSA|PRA[CÇ]A)\b|\d{2}\.\d{3}\.\d{3}|\d{5}-\d{3})/i.test(linha)) return 0;
  const cheios = linha.replace(/\s/g, "");
  const palavras = linha.split(" ").filter((p) => /^\p{L}{3,}[.,]?$/u.test(p));
  if (palavras.length < 2 || !cheios.length || letras(linha) / cheios.length < 0.8) return 0;
  let p = 1 + palavras.length * 0.1;
  if (/(LTDA|\bS\.?A\b|\bME\b|EIRELI|MERCAD|ATACAD|A[CÇ]OUGUE|PADARIA|SUPER|HORTI|DISTRIBUI|COM[EÉ]RCIO|BEBIDAS|CARNES|ASSA[IÍ]|EMP[OÓ]RIO|FRIGOR|DEP[OÓ]SITO|LOJA|ARMAZ)/i.test(linha)) p += 3;
  return p;
}
function lerTextoDaNota(texto) {
  const linhas = texto.split(/\r?\n/).map((l) => l.replace(/[|_—–]+/g, " ").replace(/\s+/g, " ").trim()).filter((l) => l.length > 1);
  const r = { loja: "", data: "", total: 0, chave: "", itens: [] };
  const digitos = texto.replace(/[^\d\n]/g, "").split("\n").find((l) => l.length === 44);
  if (digitos) r.chave = digitos;
  let pendente = null, melhorLoja = 0;
  linhas.forEach((linha, i) => {
    if (!r.data) { const d = linha.match(/(\d{2})\/(\d{2})\/(\d{4})/); if (d && +d[2] >= 1 && +d[2] <= 12) r.data = `${d[3]}-${d[2]}-${d[1]}`; }
    if (i < 8 && !r.itens.length) {
      const nota = pontoLoja(linha);
      if (nota > melhorLoja) { melhorLoja = nota; r.loja = tituloCaso(linha.replace(/[^\p{L}\p{N}\s&.-]/gu, "").replace(/\s+/g, " ").trim()).slice(0, 50); }
    }
    const m = linha.match(PRECO);
    if (IGNORAR.test(linha)) {
      if (m && /(VALOR\s*(A\s*PAGAR|TOTAL)|^TOTAL)/i.test(linha) && !/SUB/i.test(linha)) { const v = centavos(m[1]); if (v > r.total) r.total = v; }
      pendente = null; return;
    }
    if (!m) { if (letras(linha) >= 3) pendente = limparNome(linha); return; }
    let resto = linha.slice(0, m.index);
    let qtd = "";
    const q = resto.match(QTD) || resto.match(QTD_SEM_X);
    if (q) { qtd = `${q[1].replace(".", ",")}${q[2] ? " " + q[2].toUpperCase() : ""} × ${q[3].replace(".", ",")}`; resto = resto.slice(0, q.index); }
    let nome = limparNome(resto);
    if (letras(nome) < 3) { if (pendente && letras(pendente) >= 3) nome = pendente; else { pendente = null; return; } }
    pendente = null;
    const valor = centavos(m[1]);
    if (valor <= 0 || valor > 5000000) return;
    r.itens.push({ id: novoId(), nome: tituloCaso(nome).slice(0, 80), qtd, valor, usar: true });
  });
  return r;
}

async function receberFoto(arquivo) {
  const p = rota(); const c = achar(p[1]);
  if (!c || !arquivo) return;
  if (!/^image\//.test(arquivo.type) && !/\.(jpe?g|png|heic|webp)$/i.test(arquivo.name)) { avisar("Isso não parece uma foto", "alerta"); return; }
  const n = { id: novoId(), criadoEm: Date.now(), fotoId: novoId(), loja: "", data: "", total: 0, itens: [] };
  lerFoto(arquivo, c, n, true);
}
async function lerFoto(arquivo, c, n, nova) {
  const tela = document.createElement("div"); tela.className = "leitor";
  tela.innerHTML = `<div class="papel"><span class="feixe"></span></div><h2>Lendo a nota…</h2><p id="leitorTexto">Preparando o leitor</p><div class="barra"><i id="leitorBarra" style="width:4%"></i></div><button class="botao pequeno" id="leitorCancelar">Cancelar</button>`;
  document.body.appendChild(tela);
  let cancelado = false;
  tela.querySelector("#leitorCancelar").addEventListener("click", () => { cancelado = true; tela.remove(); });
  const texto = tela.querySelector("#leitorTexto"), barra = tela.querySelector("#leitorBarra");
  const prog = (pct, msg) => { barra.style.width = Math.max(4, Math.min(100, pct)) + "%"; if (msg) texto.textContent = msg; };
  try {
    const img = await abrirImagem(arquivo);
    const previa = URL.createObjectURL(arquivo);
    tela.querySelector(".papel").style.backgroundImage = `url("${previa}")`;
    let link = "";
    if ("BarcodeDetector" in window) {
      try { const det = new BarcodeDetector({ formats: ["qr_code"] }); const achados = await det.detect(img); const q = achados.find((x) => /^https?:\/\//i.test(x.rawValue)); if (q) link = q.rawValue; } catch (e) {}
    }
    if (nova) await fotos.por(n.fotoId, await fotoParaGuardar(img));
    prog(8, "Arrumando a foto");
    const cv = imagemParaLeitura(img);
    if (img.close) img.close();
    aoProgresso = (m) => {
      if (m.status === "recognizing text") prog(20 + m.progress * 78, `Lendo os itens… ${Math.round(m.progress * 100)}%`);
      else if (/load|initializ/i.test(m.status)) prog(8 + (m.progress || 0) * 10, "Preparando o leitor");
    };
    const w = await prepararLeitor();
    if (cancelado) return;
    prog(20, "Lendo os itens…");
    const { data } = await w.recognize(cv);
    aoProgresso = null;
    URL.revokeObjectURL(previa);
    if (cancelado) { if (nova) fotos.tirar(n.fotoId); return; }
    const r = lerTextoDaNota(data.text || "");
    if (r.chave && nova && c.notas.some((x) => x.chave === r.chave)) {
      tela.remove(); fotos.tirar(n.fotoId);
      avisar("Esta nota já foi lançada neste churrasco", "alerta"); return;
    }
    Object.assign(n, { itens: r.itens, chave: r.chave || n.chave || "", link: link || n.link || "", texto: (data.text || "").slice(0, 8000) });
    if (!n.loja) n.loja = r.loja; if (!n.data) n.data = r.data; if (!n.total) n.total = r.total;
    if (nova) c.notas.push(n);
    salvar();
    prog(100, "Pronto!");
    await new Promise((ok) => setTimeout(ok, 350));
    tela.remove();
    if (nova) { recentes.add(n.id); ir(`c/${c.id}/nota/${n.id}`); } else render();
    if (r.itens.length) avisar(`Li ${plural(r.itens.length, "item", "itens")}. Desmarque o que não foi para o churrasco.`, "nota");
    else avisar("Não consegui ler os itens. Lance à mão ou tire outra foto.", "alerta");
  } catch (e) {
    console.error(e);
    aoProgresso = null;
    tela.remove();
    if (nova) fotos.tirar(n.fotoId);
    avisar(navigator.onLine ? "Não consegui ler esta foto. Tente de novo." : "Na primeira leitura o celular precisa de internet.", "alerta");
  }
}
for (const id of ["arqCamera", "arqGaleria"]) $("#" + id).addEventListener("change", (e) => { const a = e.target.files[0]; e.target.value = ""; receberFoto(a); });
$("#arqCopia").addEventListener("change", async (e) => {
  const a = e.target.files[0]; e.target.value = "";
  if (!a) return;
  try {
    const copia = JSON.parse(await a.text());
    if (copia.app !== "nosso-churrasco" || !copia.estado || !Array.isArray(copia.estado.churrascos)) throw new Error("arquivo");
    if (!(await confirmar("Restaurar esta cópia?", `Ela tem ${plural(copia.estado.churrascos.length, "churrasco", "churrascos")}. O que está no aparelho agora é trocado por ela.`, "Restaurar"))) return;
    await fotos.limpar().catch(() => {});
    for (const [id, url] of Object.entries(copia.fotos || {})) await fotos.por(id, await (await fetch(url)).blob());
    estado = copia.estado; salvar(); ir(""); render(); avisar("Cópia restaurada!");
  } catch (err) { avisar("Esse arquivo não é uma cópia do Nosso Churrasco", "alerta"); }
});

/* ========= Instalar como aplicativo ========= */
let pedidoInstalar = null;
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pedidoInstalar = e; if (rota()[0] === "ajustes") render(); });
window.addEventListener("appinstalled", () => { pedidoInstalar = null; pref.por("dica-instalar", "1"); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

render();
