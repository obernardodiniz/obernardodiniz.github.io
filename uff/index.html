<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderneta UFF</title>
<meta name="description" content="Provas, notas, aulas, agenda e plano de estudo da graduação em Engenharia Química na UFF.">
<meta name="theme-color" content="#1d4f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" type="image/png" href="img/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de celular — cabeçalho fino, conteúdo em uma coluna, barra de abas fixa embaixo */
:root {
  --papel: #f2f4f8;
  --cartao: #ffffff;
  --tinta: #14213d;
  --tinta-2: #55617f;
  --linha: #d8deea;
  --uff: #1d4f9e;
  --uff-suave: #e3ebf8;
  --marca: #f2b632;
  --marca-suave: #fdf1cf;
  --ok: #1d7f53;
  --vs: #b86a00;
  --rep: #bf3326;
  --ok-suave: #ddf1e6;
  --vs-suave: #fbecd3;
  --rep-suave: #f9e0dc;
  --ext: #a3367a;
  --ext-suave: #f7e1ee;
  --f-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #0e1524; --cartao: #161f34; --tinta: #e7ecf6; --tinta-2: #9ca8c4; --linha: #27324d;
  --uff: #82a9ff; --uff-suave: #1c2a4a; --marca: #f5c451; --marca-suave: #3a3018;
  --ok: #52c590; --vs: #f0a640; --rep: #ff7f70; --ok-suave: #15342a; --vs-suave: #3a2a12; --rep-suave: #3d1d1a;
  --ext: #f08cc4; --ext-suave: #3a1a2e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --papel: #0e1524; --cartao: #161f34; --tinta: #e7ecf6; --tinta-2: #9ca8c4; --linha: #27324d;
  --uff: #82a9ff; --uff-suave: #1c2a4a; --marca: #f5c451; --marca-suave: #3a3018;
  --ok: #52c590; --vs: #f0a640; --rep: #ff7f70; --ok-suave: #15342a; --vs-suave: #3a2a12; --rep-suave: #3d1d1a;
  --ext: #f08cc4; --ext-suave: #3a1a2e;
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 16px/1.45 var(--f-texto); padding-top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papel); }
.pagina { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; }
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.rotulo { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-2); font-weight: 700; }
.fraco { color: var(--tinta-2); }
.pequeno { font-size: 0.86rem; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--uff); outline-offset: 2px; }

.topo { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topo .sem { font-family: var(--f-num); font-size: 0.85rem; color: var(--uff); background: var(--uff-suave); padding: 3px 9px; border-radius: 6px; }

.secao { display: grid; gap: 10px; }
.secao-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.lista { display: grid; background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
.linha { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--linha); min-width: 0; }
.linha:first-child { border-top: 0; }
.linha > div { min-width: 0; }
.linha.clicavel { cursor: pointer; }
.linha.clicavel:hover { background: var(--uff-suave); }
.linha .t { font-weight: 600; overflow-wrap: anywhere; }
.linha .s { font-size: 0.86rem; color: var(--tinta-2); overflow-wrap: anywhere; }
.vazio { padding: 18px 14px; color: var(--tinta-2); background: var(--cartao); border: 1px dashed var(--linha); border-radius: 12px; }

.dmenos { font-family: var(--f-num); font-weight: 600; font-size: 0.82rem; min-width: 52px; text-align: center; padding: 4px 6px; border-radius: 6px; background: var(--uff-suave); color: var(--uff); }
.dmenos.urgente { background: var(--marca); color: #2a2100; }
.dmenos.perto { background: var(--marca-suave); color: var(--tinta); }
.dmenos.passou { background: transparent; color: var(--tinta-2); border: 1px solid var(--linha); }

.pilula { font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--ok-suave); color: var(--ok); }
.p-vs { background: var(--vs-suave); color: var(--vs); }
.p-rep { background: var(--rep-suave); color: var(--rep); }
.p-cur { background: var(--uff-suave); color: var(--uff); }
.p-pen { background: transparent; color: var(--tinta-2); border: 1px solid var(--linha); }

/* destaque da próxima prova */
.proxima { background: var(--uff); color: #fff; border-radius: 14px; padding: 18px; display: grid; gap: 6px; }
.proxima .rotulo { color: rgba(255,255,255,0.78); }
.proxima .grande { font-family: var(--f-titulo); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.proxima .grande small { font-size: 1rem; font-weight: 600; margin-left: 6px; }
:root[data-theme="dark"] .proxima, :root:not([data-theme="light"]) .proxima { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .proxima { background: #23407c; } }
:root[data-theme="dark"] .proxima { background: #23407c; }

.numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.numero { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.numero .v { font-family: var(--f-num); font-size: 1.35rem; font-weight: 600; }

.barra { height: 10px; border-radius: 999px; background: var(--linha); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--ok); }

/* cartão de disciplina no período */
.disc { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
.disc-cab { padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; border-bottom: 1px solid var(--linha); }
.disc-cab > div { min-width: 0; }
.disc-cab .cod { font-family: var(--f-num); font-size: 0.8rem; color: var(--tinta-2); }
.aval { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--linha); }
.aval:first-of-type { border-top: 0; }
.aval > div { min-width: 0; }
.nota { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; min-width: 44px; text-align: right; }
.nota.vazia { color: var(--tinta-2); font-weight: 500; }
.disc-pe { padding: 12px 14px; background: var(--papel); border-top: 1px solid var(--linha); display: grid; gap: 4px; }
.disc-pe .media { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.disc-acoes { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--linha); }

.btn { border: 1px solid var(--linha); background: var(--cartao); padding: 8px 12px; border-radius: 9px; font-weight: 600; font-size: 0.92rem; }
.btn:hover { border-color: var(--uff); }
.btn.forte { background: var(--uff); border-color: var(--uff); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.forte { color: #0e1524; } }
:root[data-theme="dark"] .btn.forte { color: #0e1524; }
.btn.perigo { color: var(--rep); }
.btn.perigo.armado { background: var(--rep); color: #fff; border-color: var(--rep); }
.btn:disabled { opacity: 0.55; cursor: default; }

.marcar { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--linha); background: var(--cartao); display: grid; place-items: center; padding: 0; }
.marcar.feito { background: var(--ok); border-color: var(--ok); color: #fff; }
.feito-txt .t { text-decoration: line-through; color: var(--tinta-2); }

.periodo-grupo { display: grid; gap: 6px; }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.filtro { border: 1px solid var(--linha); background: var(--cartao); border-radius: 999px; padding: 5px 11px; font-size: 0.86rem; font-weight: 600; }
.filtro[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }

/* abas de baixo */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--cartao); border-top: 1px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.abas-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }

/* calendário */
.mes-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mes-cab h2 { font-size: 1.25rem; text-transform: capitalize; }
.mes-nav { display: flex; gap: 6px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .sem-d { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tinta-2); text-align: center; padding-bottom: 2px; }
.dia { border: 1px solid var(--linha); background: var(--cartao); border-radius: 9px; min-height: 54px; padding: 5px 4px; display: grid; align-content: space-between; justify-items: center; gap: 4px; }
.dia.fora { background: transparent; border-color: transparent; color: var(--tinta-2); opacity: 0.5; }
.dia .n { font-family: var(--f-num); font-size: 0.86rem; font-weight: 600; }
.dia.hoje .n { background: var(--uff); color: #fff; border-radius: 6px; padding: 0 5px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dia.hoje .n { color: #0e1524; } }
:root[data-theme="dark"] .dia.hoje .n { color: #0e1524; }
.dia[aria-pressed="true"] { border-color: var(--uff); box-shadow: inset 0 0 0 1px var(--uff); }
.pontos { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 7px; }
.ponto { width: 7px; height: 7px; border-radius: 50%; }
.c-prova { background: var(--marca); }
.c-estudo { background: var(--uff); opacity: 0.45; }
.c-facul { background: var(--uff); }
.c-ext { background: var(--ext); }
.legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--tinta-2); }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.tag-ext { background: var(--ext-suave); color: var(--ext); }
.tag-facul { background: var(--uff-suave); color: var(--uff); }
.hora { font-family: var(--f-num); font-size: 0.82rem; font-weight: 600; min-width: 52px; text-align: center; color: var(--tinta-2); }
.aba { border: 0; background: none; padding: 10px 2px 12px; display: grid; justify-items: center; gap: 3px; font-size: 0.7rem; font-weight: 700; color: var(--tinta-2); min-width: 0; white-space: nowrap; letter-spacing: -0.01em; }
.aba svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.aba[aria-current="page"] { color: var(--uff); }

/* folha de edição */
dialog { border: 0; padding: 0; width: min(560px, 100%); max-height: 92vh; border-radius: 16px 16px 0 0; margin: auto auto 0; background: var(--cartao); color: var(--tinta); }
@media (min-width: 640px) { dialog { border-radius: 16px; margin: auto; } }
dialog::backdrop { background: rgba(10, 16, 30, 0.5); }
.folha { display: grid; gap: 14px; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
.campo { display: grid; gap: 4px; }
.campo label { font-size: 0.84rem; font-weight: 700; color: var(--tinta-2); }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--linha); background: var(--papel); border-radius: 9px; padding: 10px 11px; font-size: 1rem; }
.campo textarea { min-height: 84px; resize: vertical; }
.campos-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.folha-pe { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.folha-pe .dir { display: flex; gap: 8px; margin-left: auto; }
.ajuda { font-size: 0.84rem; color: var(--tinta-2); }

.aviso-sistema { background: var(--marca-suave); border: 1px solid var(--marca); border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; }
.plano-item { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: start; }
.plano-item input { padding: 8px; }
.resposta-claude { white-space: pre-wrap; background: var(--papel); border: 1px solid var(--linha); border-radius: 9px; padding: 10px; font-size: 0.92rem; max-height: 220px; overflow: auto; }
.rodape { font-size: 0.8rem; color: var(--tinta-2); }
@media (prefers-reduced-motion: no-preference) { .linha, .btn, .aba { transition: background-color .15s, border-color .15s, color .15s; } }
@media (max-width: 380px) { .numeros { grid-template-columns: 1fr 1fr; } .proxima .grande { font-size: 2.2rem; } }
.hoje-data { margin: 0; font-size: 1.02rem; color: var(--tinta-2); }
.hoje-data strong { color: var(--tinta); }
.acoes-folha { display: flex; gap: 8px; flex-wrap: wrap; }
.linha-cod { grid-template-columns: 74px minmax(0, 1fr) auto; }
#conteudo { display: grid; gap: 24px; min-width: 0; }
.secao-cab { align-items: center; }
.secao-cab > p { flex: 1 1 220px; }
.disc-acoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* marca da UFF: o arquivo oficial vira máscara, pintada com a cor do tema */
.marca { display: grid; gap: 4px; }
.logo-uff { display: block; width: 118px; }
.logo-uff img { display: block; width: 100%; height: auto; }
.info { background: var(--uff-suave); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.info-cab { display: flex; align-items: center; gap: 10px; }
.info-cab .logo-uff { width: 54px; flex: none; }
.info-cab h2 { font-size: 1rem; }
.info-linhas { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.info-linhas li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.info-linhas .quando { font-family: var(--f-num); font-size: 0.8rem; font-weight: 600; color: var(--uff); white-space: nowrap; }
.info-linhas.texto li { grid-template-columns: 1fr; gap: 2px; }
.info-linhas strong { font-weight: 700; }
.fonte { font-size: 0.78rem; color: var(--tinta-2); }
.puxar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translate(-50%, 0); z-index: 20;
  background: var(--cartao); color: var(--tinta-2); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 14px;
  font-size: 0.86rem; font-weight: 700; box-shadow: 0 4px 14px rgba(10, 20, 40, 0.12); white-space: nowrap; }
.puxar.pronto { color: var(--uff); border-color: var(--uff); }
.rodape-uff { display: grid; gap: 8px; justify-items: start; padding-top: 6px; border-top: 1px solid var(--linha); }
.rodape-uff .logo-uff { width: 64px; opacity: 0.7; }
.rodape-uff .rodape { margin: 0; }
.c-uff { background: transparent; box-shadow: inset 0 0 0 2px var(--tinta-2); }
.dia.sem-aula .n { color: var(--tinta-2); text-decoration: line-through; }
.dia.hoje.sem-aula .n { text-decoration: none; }
.disc-acoes .btn { text-align: center; }
.linha .pilula, .linha .nota { justify-self: end; }
.numero { align-content: start; }
</style>
</head>
<body>

<div class="pagina" id="app">
  <header class="topo">
    <div class="marca">
      <a class="logo-uff" href="https://www.uff.br/" target="_blank" rel="noopener"><picture><source srcset="img/logo-uff-branco.svg" media="(prefers-color-scheme: dark)"><img src="img/logo-uff.svg" alt="UFF – Universidade Federal Fluminense" width="312" height="94"></picture></a>
      <div class="rotulo" id="curso-nome">Graduação</div>
      <h1 id="titulo-aba">Hoje</h1>
    </div>
    <span class="sem" id="semestre">—</span>
  </header>
  <div id="aviso-sistema" class="aviso-sistema" hidden></div>
  <main id="conteudo"></main>
</div>

<nav class="abas" aria-label="Seções">
  <div class="abas-in">
    <button class="aba" data-aba="hoje" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Hoje</button>
    <button class="aba" data-aba="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="aba" data-aba="periodo"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h6"/></svg>Período</button>
    <button class="aba" data-aba="curso"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"/></svg>Curso</button>
    <button class="aba" data-aba="certificados"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 13.2 7.5 21l4.5-2.4 4.5 2.4-1.5-7.8"/></svg>Certificados</button>
    <button class="aba" data-aba="estudo"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Estudo</button>
  </div>
</nav>

<div id="puxar" class="puxar" role="status" hidden>Puxe para atualizar</div>
<dialog id="folha"><form class="folha" id="folha-form" method="dialog"></form></dialog>

<script>
"use strict";
/* ---------- estado ---------- */
const S = { discs: new Map(), avals: new Map(), avisos: new Map(), eventos: new Map(), perfil: {}, aba: "hoje", filtroCurso: "todas", mes: null, diaSel: null };
let db = null, sample = null, podeEscrever = true;

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hojeISO = () => { const d = new Date(); return iso(d); };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const deISO = (s) => { const [a, m, d] = String(s).split("-").map(Number); return new Date(a, (m || 1) - 1, d || 1); };
const diasAte = (s) => Math.round((deISO(s) - deISO(hojeISO())) / 86400000);
const somaDias = (s, n) => { const d = deISO(s); d.setDate(d.getDate() + n); return iso(d); };
const SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const dataCurta = (s) => { if (!s) return "sem data"; const d = deISO(s); return `${SEMANA[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`; };
const nota1 = (n) => (n == null || n === "" || Number.isNaN(Number(n))) ? "—" : Number(n).toFixed(1).replace(".", ",");
const lerNota = (t) => { if (t == null) return null; const s = String(t).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return Number.isFinite(n) && n >= 0 && n <= 10 ? Math.round(n * 10) / 10 : NaN; };
function chipDias(s) {
  if (!s) return `<span class="dmenos passou">s/ data</span>`;
  const n = diasAte(s);
  if (n < 0) return `<span class="dmenos passou">há ${-n} d</span>`;
  if (n === 0) return `<span class="dmenos urgente">HOJE</span>`;
  if (n === 1) return `<span class="dmenos urgente">amanhã</span>`;
  return `<span class="dmenos ${n <= 3 ? "urgente" : n <= 7 ? "perto" : ""}">D-${n}</span>`;
}
const nomeDisc = (id) => S.discs.get(id)?.nome || "Disciplina";
const ordenarPor = (arr, f) => arr.slice().sort((a, b) => (f(a) < f(b) ? -1 : f(a) > f(b) ? 1 : 0));

/* ---------- regras da UFF (Regulamento dos Cursos de Graduação, Res. CEP 001/2015, arts. 96 e 99) ---------- */
function situacaoDisc(id) {
  const avs = [...S.avals.values()].filter((a) => a.disciplinaId === id);
  const regulares = avs.filter((a) => a.tipo !== "vs");
  const vs = avs.find((a) => a.tipo === "vs");
  const pesoTotal = regulares.reduce((s, a) => s + (Number(a.peso) || 1), 0);
  const comNota = regulares.filter((a) => a.nota != null);
  const pesoFeito = comNota.reduce((s, a) => s + (Number(a.peso) || 1), 0);
  const pontos = comNota.reduce((s, a) => s + (Number(a.peso) || 1) * a.nota, 0);
  const r = { avs, regulares, vs, pesoTotal, pesoFeito, media: null, parcial: null, texto: "", classe: "p-cur", rotulo: "Cursando" };
  if (!regulares.length) { r.texto = "Cadastre as provas e trabalhos desta matéria para acompanhar a média."; return r; }
  if (pesoFeito > 0) r.parcial = pontos / pesoFeito;
  if (pesoFeito < pesoTotal) {
    const falta = pesoTotal - pesoFeito;
    const precisa6 = (6 * pesoTotal - pontos) / falta;
    const precisa4 = (4 * pesoTotal - pontos) / falta;
    if (!comNota.length) r.texto = "Para passar direto, a média das avaliações precisa ficar em 6,0 ou mais.";
    else if (precisa6 <= 0) { r.texto = "Você já garantiu a média 6,0, mesmo tirando zero no que falta."; r.classe = "p-ok"; r.rotulo = "Garantido"; }
    else if (precisa6 <= 10) r.texto = `Para passar direto, precisa de média ${nota1(precisa6)} no que falta.`;
    else if (precisa4 <= 10) { r.texto = `Não dá mais para passar direto. Para ir à VS, precisa de média ${nota1(Math.max(precisa4, 0))} no que falta.`; r.classe = "p-vs"; r.rotulo = "Rumo à VS"; }
    else { r.texto = "Mesmo com 10 no que falta, a média não chega a 4,0."; r.classe = "p-rep"; r.rotulo = "Em risco"; }
    return r;
  }
  r.media = pontos / pesoTotal;
  if (r.media >= 6) { r.texto = "Média 6,0 ou mais: aprovado direto (com frequência de 75%)."; r.classe = "p-ok"; r.rotulo = "Aprovado"; }
  else if (r.media >= 4) {
    if (vs && vs.nota != null) {
      if (vs.nota >= 6) { r.texto = `VS ${nota1(vs.nota)}: aprovado (a VS precisa de 6,0).`; r.classe = "p-ok"; r.rotulo = "Aprovado na VS"; }
      else { r.texto = `VS ${nota1(vs.nota)}: abaixo de 6,0.`; r.classe = "p-rep"; r.rotulo = "Reprovado"; }
    } else { r.texto = "Média entre 4,0 e 5,9: vai para a VS e precisa tirar 6,0 nela."; r.classe = "p-vs"; r.rotulo = "VS"; }
  } else { r.texto = "Média abaixo de 4,0: reprovado sem direito a VS."; r.classe = "p-rep"; r.rotulo = "Reprovado"; }
  return r;
}

const SITUACOES = { "a-conferir": ["A conferir", "p-pen"], aprovado: ["Aprovado", "p-ok"], cursando: ["Cursando", "p-cur"], pendente: ["Falta cursar", "p-pen"], reprovado: ["Reprovado", "p-rep"], trancado: ["Trancado", "p-pen"] };

/* ---------- horários de aula: "seg 14:00-16:00; qua 14:00-16:00" ---------- */
const DIAS_TXT = { dom: 0, seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6, "sáb": 6 };
function lerHorarios(t) {
  const out = [];
  for (const m of String(t || "").toLowerCase().matchAll(/(dom|seg|ter|qua|qui|sex|s[aá]b)\D*?(\d{1,2})[:h](\d{2})\s*(?:-|–|\/|a|às)\s*(\d{1,2})[:h](\d{2})/g)) {
    out.push({ dia: DIAS_TXT[m[1]], inicio: `${m[2].padStart(2, "0")}:${m[3]}`, fim: `${m[4].padStart(2, "0")}:${m[5]}` });
  }
  return out;
}
const escreverHorarios = (hs) => (hs || []).map((h) => `${SEMANA[h.dia]} ${h.inicio}-${h.fim}`).join("; ");
const horaCurta = (t) => { const [h, m] = String(t).split(":"); return `${Number(h)}h${m && m !== "00" ? m : ""}`; };
function mostrarHorarios(hs) {
  const grupos = new Map();
  for (const h of hs || []) { const k = `${horaCurta(h.inicio)}–${horaCurta(h.fim)}`; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(SEMANA[h.dia]); }
  return [...grupos].map(([k, dias]) => `${dias.join(" e ")}, ${k}`).join(" · ");
}

/* ---------- agenda: tudo o que cai num dia ---------- */
function dentroDoSemestre(d) {
  const { inicioSemestre: i, fimSemestre: f } = S.perfil;
  return (!i || d >= i) && (!f || d <= f);
}
/* calendário oficial da UFF (vem no arquivo de dados do site) */
const datasUff = () => (typeof BASE !== "undefined" && BASE.calendarioUff?.datas) || [];
const fonteUff = () => (typeof BASE !== "undefined" && BASE.calendarioUff?.fonte) || "";
const semAula = (d) => datasUff().some((x) => x.tipo === "feriado" && x.data === d);
function uffNoDia(d) {
  const out = [];
  for (const x of datasUff()) {
    if (x.data === d) out.push(x.fim ? `${x.titulo}: começa hoje, vai até ${dataCurta(x.fim)}` : x.titulo);
    else if (x.fim === d) out.push(`${x.titulo}: termina hoje`);
  }
  return out;
}
function itensDoDia(d) {
  const out = [];
  const dow = deISO(d).getDay();
  for (const t of uffNoDia(d)) out.push({ cor: "c-uff", hora: "UFF", titulo: t, sub: "Calendário oficial da UFF", acao: "", id: "" });
  for (const a of S.avals.values()) if (a.data === d) out.push({ cor: "c-prova", hora: a.hora || "", titulo: `${a.nome} · ${nomeDisc(a.disciplinaId)}`, sub: a.nota != null ? "nota " + nota1(a.nota) : (a.conteudo || "Prova"), acao: "editar-aval", id: a.id });
  for (const e of S.eventos.values()) {
    const repete = e.repeteAte && d >= e.data && d <= e.repeteAte && diasAte(d) - diasAte(e.data) >= 0 && (diasAte(d) - diasAte(e.data)) % 7 === 0;
    if (e.data === d || repete) out.push({ cor: e.categoria === "externo" ? "c-ext" : "c-facul", hora: e.hora || "", titulo: e.titulo, sub: [e.horaFim ? "até " + e.horaFim : "", e.local, e.categoria === "externo" ? "Fora da faculdade" : "Faculdade"].filter(Boolean).join(" · "), acao: "editar-evento", id: e.id });
  }
  if (dentroDoSemestre(d) && !semAula(d)) for (const disc of S.discs.values()) {
    if (disc.situacao !== "cursando") continue;
    for (const h of disc.horarios || []) if (h.dia === dow) out.push({ cor: "c-facul", hora: h.inicio, titulo: `Aula · ${disc.nome}`, sub: [`até ${h.fim}`, disc.professor, disc.turma ? "turma " + disc.turma : ""].filter(Boolean).join(" · "), acao: "editar-disc", id: disc.id, aula: true });
  }
  for (const v of S.avisos.values()) if (v.data === d && !v.feito) out.push({ cor: "c-estudo", hora: "", titulo: v.texto, sub: v.disciplinaId ? "Estudo · " + nomeDisc(v.disciplinaId) : "Estudo", acao: "editar-aviso", id: v.id });
  const chave = (i) => (i.cor === "c-uff" ? "00" : i.hora || "99");
  return out.sort((a, b) => (chave(a) < chave(b) ? -1 : chave(a) > chave(b) ? 1 : 0));
}
const ddmm = (s) => String(s).split("-").reverse().slice(0, 2).join("/");
const logoUff = () => `<span class="logo-uff"><picture><source srcset="img/logo-uff-branco.svg" media="(prefers-color-scheme: dark)"><img src="img/logo-uff.svg" alt="" width="312" height="94"></picture></span>`;
function cartaoUff(titulo, corpo, fonte) {
  return `<section class="info"><div class="info-cab">${logoUff()}<h2>${titulo}</h2></div>${corpo}${fonte ? `<div class="fonte">${fonte}</div>` : ""}</section>`;
}
function listaDatasUff(itens) {
  const h = hojeISO();
  return `<ul class="info-linhas">${itens.map((x) => {
    const quando = x.fim ? (x.data <= h ? "até " + ddmm(x.fim) : `${ddmm(x.data)}–${ddmm(x.fim)}`) : ddmm(x.data);
    const passou = (x.fim || x.data) < h;
    return `<li${passou ? ' style="opacity:.55"' : ""}><span class="quando">${quando}</span><span>${esc(x.titulo)}</span></li>`;
  }).join("")}</ul>`;
}
function cartaoCalendarioHoje() {
  const h = hojeISO();
  const chave = (x) => (x.data >= h ? x.data : x.fim);
  const prox = datasUff().filter((x) => (x.fim || x.data) >= h).sort((a, b) => (chave(a) < chave(b) ? -1 : 1)).slice(0, 3);
  const fim = S.perfil.fimSemestre;
  if (!prox.length && !fim) return "";
  const resta = fim && fim >= h ? `<p style="margin:0">Faltam <strong>${diasAte(fim)} dias</strong> para o fim das aulas, em ${dataCurta(fim).replace(/ /g, " ")}.</p>` : "";
  return cartaoUff("Calendário da UFF", resta + listaDatasUff(prox), "Fonte: " + esc(fonteUff()));
}
function linhaAgenda(i) {
  return `<div class="linha ${i.acao ? "clicavel" : ""}" ${i.acao ? `data-acao="${i.acao}" data-id="${esc(i.id)}"` : ""}><span class="hora">${esc(i.hora || "—")}</span>
    <div><div class="t"><span class="ponto ${i.cor}" style="display:inline-block;margin-right:6px;vertical-align:1px"></span>${esc(i.titulo)}</div><div class="s">${esc(i.sub)}</div></div><span></span></div>`;
}
function resumoCurso() {
  const ds = [...S.discs.values()].filter((d) => d.tipo !== "optativa-extra");
  const ch = (d) => Number(d.cargaHoraria) || 0;
  const chTotal = Number(S.perfil.chTotal) || ds.filter((d) => d.tipo !== "optativa").reduce((s, d) => s + ch(d), 0);
  const chAprov = Number(S.perfil.chObtida) || ds.filter((d) => d.situacao === "aprovado").reduce((s, d) => s + ch(d), 0);
  const comNota = ds.filter((d) => (d.situacao === "aprovado" || d.situacao === "reprovado") && d.notaFinal != null && ch(d) > 0);
  const chN = comNota.reduce((s, d) => s + ch(d), 0);
  const cr = S.perfil.crOficial || (chN ? (comNota.reduce((s, d) => s + d.notaFinal * ch(d), 0) / chN).toFixed(1).replace(".", ",") : null);
  return { chTotal, chAprov, cr, aprovadas: ds.filter((d) => d.situacao === "aprovado").length, faltam: ds.filter((d) => d.situacao === "pendente").length, cursando: ds.filter((d) => d.situacao === "cursando") };
}

const NOMES_MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function telaAgenda() {
  const h = hojeISO();
  if (!S.mes) S.mes = h.slice(0, 7);
  if (!S.diaSel) S.diaSel = h;
  const [ano, mes] = S.mes.split("-").map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const inicio = new Date(primeiro); inicio.setDate(1 - primeiro.getDay());
  let grade = SEMANA.map((s) => `<div class="sem-d">${s}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + k);
    if (k >= 35 && d.getMonth() !== mes - 1) break;
    const di = iso(d);
    const itens = itensDoDia(di);

      <span class="n">${d.getDate()}</span><span class="pontos">${cores.map((c) => `<i class="ponto ${c}"></i>`).join("")}</span></button>`;
  }

  return `<section class="secao">
    <div class="mes-cab"><h2>${NOMES_MES[mes - 1]} ${ano}</h2><div class="mes-nav"><button class="btn" data-acao="mes" data-passo="-1" aria-label="Mês anterior">‹</button><button class="btn" data-acao="mes" data-passo="0">Hoje</button><button class="btn" data-acao="mes" data-passo="1" aria-label="Próximo mês">›</button></div></div>
    <div class="cal">${grade}</div>
    <div class="legenda"><span><i class="ponto c-prova"></i>Prova</span><span><i class="ponto c-facul"></i>Aula e faculdade</span><span><i class="ponto c-ext"></i>Fora da faculdade</span><span><i class="ponto c-estudo"></i>Estudo</span><span><i class="ponto c-uff"></i>Data da UFF</span></div>
  </section>

  </section>
  ${datasUff().length ? cartaoUff(`Datas oficiais de ${esc(S.perfil.semestreAtual || "2026.2")}`, listaDatasUff(datasUff()) + `<p class="pequeno" style="margin:0">Nos feriados e pontos facultativos não há aula: o calendário já tira as aulas desses dias.</p>`, "Fonte: " + esc(fonteUff())) : ""}` + rodape();
}

function telaHoje() {
  const h = hojeISO();
  const proximas = ordenarPor([...S.avals.values()].filter((a) => a.data && a.data >= h && a.nota == null), (a) => a.data);
  const avisos = ordenarPor([...S.avisos.values()].filter((v) => !v.feito && v.data && v.data <= somaDias(h, 1)), (v) => v.data);
  const rc = resumoCurso();
  const p = proximas[0];

  let out = `<p class="hoje-data">Hoje é <strong>${DIAS_LONGOS[hd.getDay()]}, ${hd.getDate()} de ${NOMES_MES[hd.getMonth()]}</strong>.</p>`;

    <div class="numero"><span class="rotulo">Curso feito</span><span class="v">${rc.chTotal ? Math.round((rc.chAprov / rc.chTotal) * 100) + "%" : "—"}</span><span class="pequeno fraco">${rc.chAprov} de ${rc.chTotal || "?"} h</span></div>

  out += `<section class="secao"><div class="secao-cab"><h2>Próximas avaliações</h2><button class="btn" data-acao="nova-aval">+ Prova</button></div>`;
  out += proximas.length ? `<div class="lista">${proximas.slice(0, 8).map(linhaAval).join("")}</div>` : `<div class="vazio">Nenhuma prova marcada ainda. Toque em “+ Prova” para cadastrar a data.</div>`;

    out += `<article class="disc">

  if (!S.discs.size) return out + `<div class="vazio">O currículo ainda não foi carregado. Ele vem do idUFF (currículo integralizado) e do fluxograma do curso.</div>` + rodape();
  for (const k of [...grupos.keys()].sort((a, b) => a - b)) {
    const ds = ordenarPor(grupos.get(k), (d) => d.nome);

        <span class="pilula ${c}">${t}</span></div>`; }).join("")}</div></section>`;

function telaEstudo() {
  const h = hojeISO();
  const todos = ordenarPor([...S.avisos.values()], (v) => v.data || "9999");
  const atras = todos.filter((v) => !v.feito && v.data && v.data < h);
  const hoje = todos.filter((v) => !v.feito && v.data === h);
  const semana = todos.filter((v) => !v.feito && v.data > h && v.data <= somaDias(h, 7));
  const depois = todos.filter((v) => !v.feito && (!v.data || v.data > somaDias(h, 7)));
  const feitos = todos.filter((v) => v.feito).reverse().slice(0, 15);
  let out = `<div class="secao-cab"><p class="fraco pequeno" style="margin:0">Cada prova vira uma sequência de revisões em dias diferentes. Os avisos de hoje aparecem na aba Hoje.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-acao="novo-aviso">+ Aviso</button><button class="btn forte" data-acao="plano">Montar plano</button></div></div>`;
  const bloco = (t, arr, vazio) => `<section class="secao"><h2>${t}</h2>${arr.length ? `<div class="lista">${arr.map(linhaAviso).join("")}</div>` : `<div class="vazio">${vazio}</div>`}</section>`;
  if (atras.length) out += bloco("Atrasados", atras, "");
  out += bloco("Hoje", hoje, "Nada para hoje.");
  out += bloco("Próximos 7 dias", semana, "Nada marcado para a semana.");
  if (depois.length) out += bloco("Mais adiante", depois, "");
  if (feitos.length) out += bloco("Feitos recentemente", feitos, "");
  out += `<section class="secao"><h2>Como estudar para prova</h2><div class="lista">
    ${[["Tirar da memória", "Fechar o caderno e tentar resolver ou explicar. Errar e corrigir fixa mais do que reler."], ["Espaçar", "Várias sessões curtas em dias diferentes rendem mais que uma noite inteira na véspera."], ["Misturar tipos", "Alternar exercícios de assuntos diferentes treina a reconhecer qual método usar na prova."], ["Prova antiga cronometrada", "Dois ou três dias antes, simular a prova de verdade mostra onde ainda falta."]].map(([t, s]) => `<div class="linha" style="grid-template-columns:1fr"><div><div class="t">${t}</div><div class="s">${s}</div></div></div>`).join("")}
  </div></section>`;
  return out + rodape();
}

function rodape() {
  return `<footer class="rodape-uff">${logoUff()}
    <p class="rodape">App pessoal de estudo. Não é um sistema oficial da UFF: notas e situação oficiais ficam no idUFF. <button class="btn" style="padding:3px 8px;font-size:0.8rem" data-acao="perfil">Ajustes</button></p></footer>`;
}

/* ---------- folha de edição ---------- */
const folha = $("#folha"), form = $("#folha-form");
let aoSalvar = null;
function campo(c) {
  const v = c.valor ?? "";
  const id = "f-" + c.id;
  let input;
  if (c.tipo === "select") input = `<select id="${id}" name="${c.id}">${c.opcoes.map(([k, t]) => `<option value="${esc(k)}" ${String(k) === String(v) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  else if (c.tipo === "file") input = `<input id="${id}" name="${c.id}" type="file" accept="${esc(c.accept || "")}">`;
  else if (c.tipo === "textarea") input = `<textarea id="${id}" name="${c.id}" placeholder="${esc(c.dica || "")}">${esc(v)}</textarea>`;
  else input = `<input id="${id}" name="${c.id}" type="${c.tipo || "text"}" value="${esc(v)}" ${c.inputmode ? `inputmode="${c.inputmode}"` : ""} placeholder="${esc(c.dica || "")}" ${c.obrig ? "required" : ""}>`;
  return `<div class="campo"><label for="${id}">${esc(c.rotulo)}</label>${input}${c.ajuda ? `<span class="ajuda">${esc(c.ajuda)}</span>` : ""}</div>`;
}
function abrirFolha({ titulo, campos, extra = "", salvar, apagar }) {
  const linhas = [];
  for (let i = 0; i < campos.length; i++) {
    const c = campos[i];
    if (c.par && campos[i + 1]) { linhas.push(`<div class="campos-2">${campo(c)}${campo(campos[i + 1])}</div>`); i++; }
    else linhas.push(campo(c));
  }
  form.innerHTML = `<h2>${esc(titulo)}</h2>${linhas.join("")}${extra}<p class="ajuda" id="folha-erro" role="alert" hidden></p>
    <div class="folha-pe">${apagar ? `<button type="button" class="btn perigo" id="folha-apagar">Apagar</button>` : ""}<div class="dir"><button type="button" class="btn" id="folha-fechar">Cancelar</button><button type="submit" class="btn forte" ${podeEscrever ? "" : "disabled"}>Salvar</button></div></div>`;
  aoSalvar = salvar;
  $("#folha-fechar").onclick = () => folha.close();
  const ap = $("#folha-apagar");
  if (ap) ap.onclick = async () => {
    if (!ap.classList.contains("armado")) { ap.classList.add("armado"); ap.textContent = "Toque de novo para apagar"; return; }
    ap.disabled = true;
    try { await apagar(); folha.close(); } catch (e) { erroFolha(e); ap.disabled = false; }
  };
  folha.showModal();
}
function erroFolha(e) { const p = $("#folha-erro"); p.hidden = false; p.style.color = "var(--rep)"; p.textContent = typeof e === "string" ? e : "Não consegui salvar agora. Confira a conexão e tente de novo."; }
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!aoSalvar) return;
  const dados = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  try { const r = await aoSalvar(dados); if (r !== false) folha.close(); }
  catch (e) { erroFolha(e); }
  finally { btn.disabled = false; }
});

const opcoesDisc = (vazio) => [...(vazio ? [["", vazio]] : []), ...ordenarPor([...S.discs.values()].filter((d) => d.situacao === "cursando"), (d) => d.nome).map((d) => [d.id, d.nome])];

async function moverAvisosDaProva(avalId, antiga, nova) {
  const delta = diasAte(nova) - diasAte(antiga);
  for (const v of S.avisos.values()) if (v.avaliacaoId === avalId && !v.feito && v.data) await db.collection("avisos").doc(v.id).update({ data: somaDias(v.data, delta) });
}

      for (const [id, x] of Object.entries(j.arquivos || {})) {

        for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);

/* ---------- certificados: os dados ficam com o resto; o PDF fica no próprio aparelho (IndexedDB) ---------- */
const idb = (() => {
  let aberto;
  const abrir = () => aberto ??= new Promise((ok, erro) => {
    const r = indexedDB.open("caderneta-uff", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("arquivos");
    r.onsuccess = () => ok(r.result);
    r.onerror = () => erro(r.error);
  });
  const usar = async (modo, fn) => {
    const banco = await abrir();
    return new Promise((ok, erro) => {
      const t = banco.transaction("arquivos", modo);
      const req = fn(t.objectStore("arquivos"));
      t.oncomplete = () => ok(req?.result);
      t.onerror = () => erro(t.error);
    });
  };
  return { get: (k) => usar("readonly", (s) => s.get(k)), set: (k, v) => usar("readwrite", (s) => s.put(v, k)), del: (k) => usar("readwrite", (s) => s.delete(k)) };
})();
const PARA = { complementares: "Atividades complementares", extensao: "Extensão", outro: "Ainda não sei" };
const tabelaHoras = () => (typeof BASE !== "undefined" && BASE.tabelaHoras) || null;
function certificadosContados() {
  const cats = tabelaHoras()?.categorias || [];
  const usado = new Map();
  return ordenarPor([...S.certs.values()], (c) => c.data || "9999").map((c) => {
    const cat = cats.find((t) => t.id === c.categoria);
    let h = Number(c.horas) || 0;
    if (cat?.limitePorCertificado != null) h = Math.min(h, cat.limitePorCertificado);
    if (cat?.limiteTotal != null) { const u = usado.get(cat.id) || 0; h = Math.max(0, Math.min(h, cat.limiteTotal - u)); usado.set(cat.id, u + h); }
    return { ...c, cat, valida: cats.length ? (cat ? h : 0) : h };
  });
}

    try {
      const lista = await sample.json(prompt, { onText: ({ text }) => { resp.textContent = text; } });

const CHAVE = "caderneta-uff-alteracoes-v1";
const COLECOES = ["disciplinas", "avaliacoes", "avisos", "eventos", "certificados", "config"];
let BASE = { perfil: {}, disciplinas: {}, avaliacoes: {}, avisos: {}, eventos: {} };
let ALT = {};
try { ALT = JSON.parse(localStorage.getItem(CHAVE) || "{}") || {}; } catch { ALT = {}; }
const ouvintes = new Map();
function guardarAlt() {
  try { localStorage.setItem(CHAVE, JSON.stringify(ALT)); }
  catch { throw "O navegador não deixou guardar neste aparelho. Saia do modo anônimo e tente de novo."; }
}
function colecao(col) {
  const out = { ...(col === "config" ? { perfil: BASE.perfil || {} } : BASE[col] || {}) };
  for (const [k, v] of Object.entries(ALT)) {
    const [c, id] = k.split("/");
    if (c !== col) continue;
    if (v === null) delete out[id]; else out[id] = v;
  }
  return out;
}
const avisarMudanca = (col) => { for (const fn of ouvintes.get(col) || []) fn(); };
const ouvirCol = (col, fn) => { if (!ouvintes.has(col)) ouvintes.set(col, []); ouvintes.get(col).push(fn); fn(); return () => {}; };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function refDoc(col, id) {
  const gravar = (v) => { ALT[col + "/" + id] = v; guardarAlt(); avisarMudanca(col); };
  return {
    id,
    async set(data) { gravar(JSON.parse(JSON.stringify(data))); },
    async update(data) { gravar({ ...(colecao(col)[id] || {}), ...JSON.parse(JSON.stringify(data)) }); },
    async delete() { gravar(null); },
    onSnapshot(fn) { return ouvirCol(col, () => { const d = colecao(col)[id]; fn({ exists: !!d, data: () => d }); }); },
  };
}
db = {
  collection: (col) => ({
    doc: (id) => refDoc(col, id || novoId()),
    onSnapshot: (fn) => ouvirCol(col, () => fn({ docs: Object.entries(colecao(col)).map(([id, d]) => ({ id, exists: true, data: () => d })) })),
  }),
  doc: (p) => { const [c, id] = p.split("/"); return refDoc(c, id); },
};
const alteracoesLocais = () => Object.keys(ALT).length;

/* ---------- arquivos: lembrete para o calendário do iPhone e cópia de segurança ---------- */
function baixar(conteudo, tipo, nome) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const icsTexto = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/[,;]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
const icsData = (d, h) => d.replace(/-/g, "") + (h ? "T" + h.replace(":", "") + "00" : "");
function lembreteIcs({ id, titulo, data, hora, horaFim, local, notas, alarmes, ate }) {
  const fimPadrao = hora ? (() => { const [hh, mm] = hora.split(":").map(Number); return `${String(Math.min(hh + 2, 23)).padStart(2, "0")}:${String(mm).padStart(2, "0")}`; })() : null;
  const linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Caderneta UFF//PT-BR", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${id}@caderneta-uff`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
    hora ? `DTSTART:${icsData(data, hora)}` : `DTSTART;VALUE=DATE:${icsData(data)}`,
    hora ? `DTEND:${icsData(data, horaFim || fimPadrao)}` : `DTEND;VALUE=DATE:${icsData(somaDias(data, 1))}`,
    `SUMMARY:${icsTexto(titulo)}`];
  if (ate) linhas.push(`RRULE:FREQ=WEEKLY;UNTIL=${icsData(ate)}T235959`);
  if (local) linhas.push(`LOCATION:${icsTexto(local)}`);
  if (notas) linhas.push(`DESCRIPTION:${icsTexto(notas)}`);
  for (const a of alarmes) linhas.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsTexto(titulo)}`, `TRIGGER:${a}`, "END:VALARM");
  linhas.push("END:VEVENT", "END:VCALENDAR");
  baixar(linhas.join("\r\n"), "text/calendar;charset=utf-8", "lembrete.ics");
}
const ALARME_DIAS = { "0": "-PT2H", "1": "-P1D", "3": "-P3D", "7": "-P7D" };

/* ---------- carregar ---------- */
const ouvir = (col, mapa) => db.collection(col).onSnapshot((snap) => { mapa.clear(); for (const d of snap.docs) mapa.set(d.id, { ...d.data(), id: d.id }); render(); });
S.certs = new Map();
ouvir("disciplinas", S.discs); ouvir("avaliacoes", S.avals); ouvir("avisos", S.avisos); ouvir("eventos", S.eventos); ouvir("certificados", S.certs);
db.doc("config/perfil").onSnapshot((d) => { S.perfil = d.exists ? d.data() : {}; render(); });
/* ---------- atualizar: ao abrir, ao voltar para o app, a cada 5 minutos e ao puxar a tela no topo ---------- */
const VERSAO_APP = "2026-10-23-4";
let atualizando = false, recarregarDepois = false;
const buscar = (arq) => fetch(`${arq}?v=${Date.now()}`, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
async function atualizar(manual) {
  if (atualizando) return;
  atualizando = true;
  try {
    const [v, dados] = await Promise.all([buscar("dados/versao.json").catch(() => null), buscar("dados/caderneta.json")]);
    let jaTentou = false;
    try { jaTentou = sessionStorage.getItem("caderneta-recarregou") === v?.app; } catch {}
    if (v?.app && v.app !== VERSAO_APP && !jaTentou) {
      try { sessionStorage.setItem("caderneta-recarregou", v.app); } catch {}
      if (folha.open) recarregarDepois = true;
      else { mostrarAviso("Tem versão nova do app. Atualizando…", true); setTimeout(() => location.reload(), 700); return; }
    }
    const mudou = JSON.stringify(dados) !== JSON.stringify(BASE);
    if (mudou) { BASE = dados; for (const c of COLECOES) avisarMudanca(c); }
    if (manual) mostrarAviso(mudou ? "Atualizado com as novidades." : "Já está tudo atualizado.", true);
    else if (mudou && BASE.atualizado && S.carregou) mostrarAviso("Dados novos chegaram.", true);
    S.carregou = true;
  } catch {
    if (manual || !S.carregou) mostrarAviso("Sem internet agora. Mostrando o que ficou guardado no celular.");
    for (const c of COLECOES) avisarMudanca(c);
  } finally { atualizando = false; }
}
folha.addEventListener("close", () => { if (recarregarDepois) location.reload(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") atualizar(false); });
setInterval(() => { if (document.visibilityState === "visible") atualizar(false); }, 5 * 60 * 1000);
atualizar(false);

// puxar para baixo no topo da tela
(() => {
  const ind = $("#puxar");
  let inicio = null, puxado = 0;
  addEventListener("touchstart", (e) => { inicio = scrollY <= 0 && !folha.open ? e.touches[0].clientY : null; puxado = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (inicio == null) return;
    puxado = e.touches[0].clientY - inicio;
    if (puxado <= 8 || scrollY > 0) { ind.hidden = true; return; }
    ind.hidden = false;
    ind.style.transform = `translate(-50%, ${Math.min(puxado, 110) * 0.55}px)`;
    ind.textContent = puxado > 80 ? "Solte para atualizar" : "Puxe para atualizar";
    ind.classList.toggle("pronto", puxado > 80);
  }, { passive: true });
  addEventListener("touchend", () => {
    if (inicio == null) return;
    const ok = puxado > 80;
    inicio = null; puxado = 0;
    if (!ok) { ind.hidden = true; ind.style.transform = ""; return; }
    ind.textContent = "Atualizando…";
    atualizar(true).finally(() => { setTimeout(() => { ind.hidden = true; ind.style.transform = ""; ind.classList.remove("pronto"); }, 400); });
  });
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).then((r) => r.update()).catch(() => {});
</script>
