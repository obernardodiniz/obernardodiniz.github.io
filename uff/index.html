      const cat = cats.find((t) => t.id === f.categoria);
      if (cats.length && !cat) throw "Escolha o tipo de atividade da tabela.";
      if ((!cats.length || cat?.cadaHoras) && !(horas > 0)) throw "Diga quantas horas o certificado tem.";
      const quantidade = cats.length ? Math.max(1, Math.round(Number(f.quantidade) || 1)) : null;
      const novo = id || novoId();
      if (arq) {
        try { await idb.set(novo, arq); } catch { throw "O celular não deixou guardar o arquivo. Libere espaço e tente de novo."; }
        try { await navigator.storage?.persist?.(); } catch {}
      }
      const doc = { titulo: f.titulo.trim(), data: f.data || null, horas, quantidade, contaPara: f.contaPara, instituicao: f.instituicao.trim(), obs: f.obs.trim(),
        arquivoNome: arq ? arq.name : c.arquivoNome || null, arquivoTipo: arq ? arq.type : c.arquivoTipo || null, arquivoTamanho: arq ? arq.size : c.arquivoTamanho || null };
      if (cats.length) doc.categoria = f.categoria || null; else doc.tipoAtividade = f.tipoAtividade.trim();
      await db.collection("certificados").doc(novo).set(doc);
    },
    apagar: id ? async () => { try { await idb.del(id); } catch {} await db.collection("certificados").doc(id).delete(); } : null,
  });
  // mostra, enquanto preenche, quanto o certificado vale pela tabela
  const selCat = $("#f-categoria");
  if (selCat) {
    selCat.closest(".campo").after($("#cert-previa"));
    const campoDe = (nome) => $("#f-" + nome)?.closest(".campo");
    let paraMexido = !!id;
    $("#f-contaPara").addEventListener("change", () => { paraMexido = true; });
    const previa = () => {
      const cat = cats.find((t) => t.id === selCat.value);
      const q = campoDe("quantidade"), hcampo = campoDe("horas");
      if (q) q.hidden = !cat || !!cat.cadaHoras;
      if (q && cat?.contar) q.querySelector("label").textContent = `Quantidade de ${cat.contar}`;
      if (hcampo) hcampo.querySelector("label").textContent = cat && !cat.cadaHoras ? "Horas (opcional)" : "Horas no certificado";
      if (cat && !paraMexido) $("#f-contaPara").value = cat.grupo === "Extensão" ? "extensao" : "complementares";
      const p = $("#cert-previa");
      if (!cat) { p.textContent = "Escolha o tipo de atividade para ver quanto vale."; return; }
      const bruta = heBruta(cat, String($("#f-horas").value).replace(",", "."), $("#f-quantidade")?.value);
      const outros = certificadosContados().filter((x) => x.cat?.id === cat.id && x.id !== id).reduce((s, x) => s + x.valida, 0);
      const vale = Math.max(0, Math.min(bruta, cat.max - outros));
      p.textContent = `Vale ${umaCasa(vale)} h (${cat.he} h ${cat.unidade}). Neste tipo você já tem ${umaCasa(outros)} de ${cat.max} h.`;
    };
    for (const n of ["categoria", "horas", "quantidade"]) $("#f-" + n)?.addEventListener("input", previa);
    selCat.addEventListener("change", previa);
    previa();
  }
  const bv = $("#cert-ver");
  if (bv) bv.onclick = () => { folha.close(); verArquivo(id); };
}

/* ---------- plano de estudo ---------- */
const ETAPAS = [
  [10, "Mapear o conteúdo de {p}: listar os tópicos e separar listas e provas antigas"],
  [7, "1ª rodada de {p}: resolver exercícios de cada tópico sem olhar a resolução"],
  [4, "Revisão ativa de {p}: refazer só o que errou e escrever as fórmulas de memória"],
  [2, "Simulado de {p}: prova antiga cronometrada, depois corrigir"],
  [1, "Véspera de {p}: revisão leve da folha de fórmulas e dormir cedo"],
];
function folhaPlano(discId) {
  const h = hojeISO();
  const futuras = ordenarPor([...S.avals.values()].filter((a) => a.data && a.data >= h && a.nota == null && (!discId || a.disciplinaId === discId)), (a) => a.data);
  if (!futuras.length) { mostrarAviso("Cadastre primeiro a data da prova (aba Período, “+ Prova/trabalho”). O plano é montado contando os dias até ela."); return; }
  abrirFolha({
    titulo: "Plano de estudo",
    campos: [{ id: "aval", rotulo: "Para qual prova?", valor: futuras[0].id, tipo: "select", opcoes: futuras.map((a) => [a.id, `${a.nome} · ${nomeDisc(a.disciplinaId)} · ${dataCurta(a.data)}`]) }],
    extra: `<div class="secao"><div class="secao-cab"><span class="rotulo">Avisos que serão criados</span>${sample ? `<button type="button" class="btn" id="plano-claude">Pedir plano ao Claude</button>` : ""}</div>
      <div id="plano-itens" class="secao"></div><div id="plano-resp" class="resposta-claude" hidden></div>
      <span class="ajuda">Edite os textos e as datas antes de salvar. Datas que já passaram ficam de fora.</span></div>`,
    salvar: async (f) => {
      const a = S.avals.get(f.aval);
      const itens = [...form.querySelectorAll(".plano-item")].map((el) => ({ data: el.querySelector('[type="date"]').value, texto: el.querySelector('[type="text"]').value.trim() })).filter((i) => i.texto && i.data);
      if (!itens.length) throw "Não sobrou nenhum aviso com data e texto.";
      for (const i of itens) await db.collection("avisos").doc().set({ texto: i.texto, data: i.data, disciplinaId: a.disciplinaId, avaliacaoId: a.id, feito: false });
      mostrarAviso(`${itens.length} avisos criados para ${a.nome} de ${nomeDisc(a.disciplinaId)}.`, true);
    },
  });
  const sel = $("#f-aval");
  const pintar = (lista) => {
    $("#plano-itens").innerHTML = lista.map((i, k) => `<div class="plano-item"><input type="date" id="pl-d-${k}" value="${esc(i.data)}" aria-label="Dia"><input type="text" id="pl-t-${k}" value="${esc(i.texto)}" aria-label="Tarefa"></div>`).join("") || `<div class="vazio">A prova é muito perto para um plano em etapas. Crie um aviso solto.</div>`;
  };
  const padrao = () => {
    const a = S.avals.get(sel.value);
    const p = `${a.nome} de ${nomeDisc(a.disciplinaId)}`;
    return ETAPAS.map(([d, t]) => ({ data: somaDias(a.data, -d), texto: t.replace("{p}", p) })).filter((i) => i.data >= h);
  };
  pintar(padrao());
  sel.onchange = () => { $("#plano-resp").hidden = true; pintar(padrao()); };
  const bc = $("#plano-claude");
  if (bc) bc.onclick = async () => {
    const a = S.avals.get(sel.value);
    const d = S.discs.get(a.disciplinaId) || {};
    const resp = $("#plano-resp");
    resp.hidden = false; resp.textContent = "Pensando…"; bc.disabled = true;
    const prompt = `Sou aluno de graduação da UFF (${S.perfil.curso || "curso não informado"}). Monte um plano de estudo para a avaliação abaixo, usando prática de recuperação (resolver sem consultar), repetição espaçada e simulado cronometrado.
Matéria: ${d.nome || "?"} (${d.codigo || ""})
Avaliação: ${a.nome}, no dia ${a.data} (hoje é ${h}, faltam ${diasAte(a.data)} dias).
Conteúdo cobrado: ${a.conteudo || "não informado"}
Responda SOMENTE com um array JSON de 3 a 7 objetos {"diasAntes": número inteiro entre 1 e ${Math.max(1, diasAte(a.data))}, "tarefa": "texto curto e concreto em português, até 120 caracteres"}, em ordem decrescente de diasAntes.`;
    try {
      const lista = await sample.json(prompt, { onText: ({ text }) => { resp.textContent = text; } });
      if (!Array.isArray(lista)) throw { code: "invalid_json" };
      const itens = lista.filter((i) => Number.isFinite(Number(i?.diasAntes)) && i?.tarefa).map((i) => ({ data: somaDias(a.data, -Math.round(Number(i.diasAntes))), texto: String(i.tarefa).slice(0, 200) })).filter((i) => i.data >= h);
      pintar(itens); resp.hidden = true;
    } catch (e) {
      const msg = { not_granted: "O Claude não foi liberado para esta página.", rate_limited: "Muitos pedidos seguidos. Tente de novo daqui a pouco.", invalid_json: "A resposta veio fora do formato. Toque de novo para tentar.", cancelled: "" }[e?.code] ?? "Não consegui falar com o Claude agora.";
      resp.textContent = msg; if (!msg) resp.hidden = true;
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") bc.hidden = true;
    } finally { bc.disabled = false; }
  };
}

/* ---------- ações ---------- */
let avisoTimer;
function mostrarAviso(t, bom) {
  const el = $("#aviso-sistema");
  el.textContent = t; el.hidden = false; el.style.borderColor = bom ? "var(--ok)" : "var(--marca)";
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => { el.hidden = true; }, 6000);
}
function exigeBanco() {
  if (db && podeEscrever) return true;
  mostrarAviso(db ? "Esta conta só pode ver a caderneta, não editar." : "Abra a caderneta pelo app ou site do Claude, conectado à sua conta, para ver e editar seus dados.");
  return false;
}
document.addEventListener("click", async (ev) => {
  const alvo = ev.target.closest("[data-acao]");
  if (!alvo || alvo.closest("dialog")) return;
  const { acao, id } = alvo.dataset;
  if (acao === "filtro") { S.filtroCurso = alvo.dataset.f; render(); return; }
  if (acao === "sub") { S.subMat = alvo.dataset.sub; try { localStorage.setItem("caderneta-sub", S.subMat); } catch {} render(); return; }
  if (acao === "ir") { irPara(alvo.dataset.ir); return; }
  if (acao === "dia") { S.diaSel = alvo.dataset.d; if (S.diaSel.slice(0, 7) !== S.mes) S.mes = S.diaSel.slice(0, 7); render(); return; }
  if (acao === "mes") {
    const passo = Number(alvo.dataset.passo);
    if (passo === 0) { S.mes = hojeISO().slice(0, 7); S.diaSel = hojeISO(); }
    else { const [a, m] = S.mes.split("-").map(Number); const d = new Date(a, m - 1 + passo, 1); S.mes = iso(d).slice(0, 7); }
    render(); return;
  }
  if (!exigeBanco()) return;
  if (acao === "nova-disc") folhaDisc(null, alvo.dataset.sit);
  else if (acao === "editar-disc") folhaDisc(id);
  else if (acao === "nova-aval") folhaAval(null, alvo.dataset.disc);
  else if (acao === "editar-aval") folhaAval(id);
  else if (acao === "novo-aviso") folhaAviso(null);
  else if (acao === "editar-aviso") folhaAviso(id);
  else if (acao === "plano") folhaPlano(alvo.dataset.disc);
  else if (acao === "perfil") folhaPerfil();
  else if (acao === "novo-evento") folhaEvento(null);
  else if (acao === "editar-evento") folhaEvento(id);
  else if (acao === "novo-cert") folhaCert(null);
  else if (acao === "receber-certs") folhaReceber();
  else if (acao === "editar-cert") folhaCert(id);
  else if (acao === "ver-cert") verArquivo(id);
  else if (acao === "marcar-aviso") {
    const v = S.avisos.get(id); if (!v) return;
    alvo.disabled = true;
    try { await db.collection("avisos").doc(id).update({ feito: !v.feito }); } catch { mostrarAviso("Não consegui marcar agora. Tente de novo."); }
    finally { alvo.disabled = false; }
  }
});
document.querySelectorAll(".aba").forEach((b) => b.addEventListener("click", () => irPara(b.dataset.aba)));
try {
  let a = localStorage.getItem("caderneta-aba");
  if (a === "periodo" || a === "curso") { S.subMat = a; a = "materias"; }
  if (a && TITULOS[a]) S.aba = a;
  const sub = localStorage.getItem("caderneta-sub"); if (sub) S.subMat = sub;
} catch {}
document.querySelectorAll(".aba").forEach((x) => x.dataset.aba === S.aba ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));

/* ---------- dados: o arquivo do site + o que você mudou neste aparelho ---------- */
const CHAVE = "caderneta-uff-alteracoes-v1";
const COLECOES = ["disciplinas", "avaliacoes", "avisos", "eventos", "certificados", "config"];
let BASE = { perfil: {}, disciplinas: {}, avaliacoes: {}, avisos: {}, eventos: {} };
let ALT = {};
try { ALT = JSON.parse(localStorage.getItem(CHAVE) || "{}") || {}; } catch { ALT = {}; }
const ouvintes = new Map();
function guardarAlt() {
  try { localStorage.setItem(CHAVE, JSON.stringify(ALT)); }
  catch { throw "O navegador não deixou guardar neste aparelho. Saia do modo anônimo e tente de novo."; }
}
function colecao(col) {
  const out = { ...(col === "config" ? { perfil: BASE.perfil || {} } : BASE[col] || {}) };
  for (const [k, v] of Object.entries(ALT)) {
    const [c, id] = k.split("/");
    if (c !== col) continue;
    if (v === null) delete out[id]; else out[id] = v;
  }
  return out;
}
const avisarMudanca = (col) => { for (const fn of ouvintes.get(col) || []) fn(); };
const ouvirCol = (col, fn) => { if (!ouvintes.has(col)) ouvintes.set(col, []); ouvintes.get(col).push(fn); fn(); return () => {}; };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function refDoc(col, id) {
  const gravar = (v) => { ALT[col + "/" + id] = v; guardarAlt(); avisarMudanca(col); };
  return {
    id,
    async set(data) { gravar(JSON.parse(JSON.stringify(data))); },
    async update(data) { gravar({ ...(colecao(col)[id] || {}), ...JSON.parse(JSON.stringify(data)) }); },
    async delete() { gravar(null); },
    onSnapshot(fn) { return ouvirCol(col, () => { const d = colecao(col)[id]; fn({ exists: !!d, data: () => d }); }); },
  };
}
db = {
  collection: (col) => ({
    doc: (id) => refDoc(col, id || novoId()),
    onSnapshot: (fn) => ouvirCol(col, () => fn({ docs: Object.entries(colecao(col)).map(([id, d]) => ({ id, exists: true, data: () => d })) })),
  }),
  doc: (p) => { const [c, id] = p.split("/"); return refDoc(c, id); },
};
const alteracoesLocais = () => Object.keys(ALT).length;

/* ---------- arquivos: lembrete para o calendário do iPhone e cópia de segurança ---------- */
function baixar(conteudo, tipo, nome) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const icsTexto = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/[,;]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
const icsData = (d, h) => d.replace(/-/g, "") + (h ? "T" + h.replace(":", "") + "00" : "");
function lembreteIcs({ id, titulo, data, hora, horaFim, local, notas, alarmes, ate }) {
  const fimPadrao = hora ? (() => { const [hh, mm] = hora.split(":").map(Number); return `${String(Math.min(hh + 2, 23)).padStart(2, "0")}:${String(mm).padStart(2, "0")}`; })() : null;
  const linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Caderneta UFF//PT-BR", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${id}@caderneta-uff`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
    hora ? `DTSTART:${icsData(data, hora)}` : `DTSTART;VALUE=DATE:${icsData(data)}`,
    hora ? `DTEND:${icsData(data, horaFim || fimPadrao)}` : `DTEND;VALUE=DATE:${icsData(somaDias(data, 1))}`,
    `SUMMARY:${icsTexto(titulo)}`];
  if (ate) linhas.push(`RRULE:FREQ=WEEKLY;UNTIL=${icsData(ate)}T235959`);
  if (local) linhas.push(`LOCATION:${icsTexto(local)}`);
  if (notas) linhas.push(`DESCRIPTION:${icsTexto(notas)}`);
  for (const a of alarmes) linhas.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsTexto(titulo)}`, `TRIGGER:${a}`, "END:VALARM");
  linhas.push("END:VEVENT", "END:VCALENDAR");
  baixar(linhas.join("\r\n"), "text/calendar;charset=utf-8", "lembrete.ics");
}
const ALARME_DIAS = { "0": "-PT2H", "1": "-P1D", "3": "-P3D", "7": "-P7D" };

/* ---------- carregar ---------- */
const ouvir = (col, mapa) => db.collection(col).onSnapshot((snap) => { mapa.clear(); for (const d of snap.docs) mapa.set(d.id, { ...d.data(), id: d.id }); render(); });
S.certs = new Map();
ouvir("disciplinas", S.discs); ouvir("avaliacoes", S.avals); ouvir("avisos", S.avisos); ouvir("eventos", S.eventos); ouvir("certificados", S.certs);
db.doc("config/perfil").onSnapshot((d) => { S.perfil = d.exists ? d.data() : {}; render(); });
/* ---------- atualizar: ao abrir, ao voltar para o app, a cada 5 minutos e ao puxar a tela no topo ---------- */
let atualizando = false, recarregarDepois = false;
const buscar = (arq) => fetch(`${arq}?v=${Date.now()}`, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
async function atualizar(manual) {
  if (atualizando) return;
  atualizando = true;
  try {
    const [v, dados] = await Promise.all([buscar("dados/versao.json").catch(() => null), buscar("dados/caderneta.json")]);
    let jaTentou = false;
    try { jaTentou = sessionStorage.getItem("caderneta-recarregou") === v?.app; } catch {}
    if (v?.app && v.app !== VERSAO_APP && !jaTentou) {
      try { sessionStorage.setItem("caderneta-recarregou", v.app); } catch {}
      if (folha.open) recarregarDepois = true;
      else { mostrarAviso("Tem versão nova do app. Atualizando…", true); setTimeout(() => location.reload(), 700); return; }
    }
    const mudou = JSON.stringify(dados) !== JSON.stringify(BASE);
    if (mudou) { BASE = dados; for (const c of COLECOES) avisarMudanca(c); }
    if (manual) mostrarAviso(mudou ? "Atualizado com as novidades." : "Já está tudo atualizado.", true);
    else if (mudou && BASE.atualizado && S.carregou) mostrarAviso("Dados novos chegaram.", true);
    S.carregou = true;
  } catch {
    if (manual || !S.carregou) mostrarAviso("Sem internet agora. Mostrando o que ficou guardado no celular.");
    for (const c of COLECOES) avisarMudanca(c);
  } finally { atualizando = false; }
}
folha.addEventListener("close", () => { if (recarregarDepois) location.reload(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") atualizar(false); });
setInterval(() => { if (document.visibilityState === "visible") atualizar(false); }, 5 * 60 * 1000);
atualizar(false);

// puxar para baixo no topo da tela
(() => {
  const ind = $("#puxar");
  let inicio = null, puxado = 0;
  addEventListener("touchstart", (e) => { inicio = scrollY <= 0 && !folha.open && $("#visor").hidden ? e.touches[0].clientY : null; puxado = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (inicio == null) return;
    puxado = e.touches[0].clientY - inicio;
    if (puxado <= 8 || scrollY > 0) { ind.hidden = true; return; }
    ind.hidden = false;
    ind.style.transform = `translate(-50%, ${Math.min(puxado, 110) * 0.55}px)`;
    ind.textContent = puxado > 80 ? "Solte para atualizar" : "Puxe para atualizar";
    ind.classList.toggle("pronto", puxado > 80);
  }, { passive: true });
  addEventListener("touchend", () => {
    if (inicio == null) return;
    const ok = puxado > 80;
    inicio = null; puxado = 0;
    if (!ok) { ind.hidden = true; ind.style.transform = ""; return; }
    ind.textContent = "Atualizando…";
    atualizar(true).finally(() => { setTimeout(() => { ind.hidden = true; ind.style.transform = ""; ind.classList.remove("pronto"); }, 400); });
  });
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).then((r) => r.update()).catch(() => {});
