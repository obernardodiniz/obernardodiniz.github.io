<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderneta UFF</title>
<meta name="description" content="Provas, notas, aulas, agenda e plano de estudo da graduação em Engenharia Química na UFF.">
<meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08111F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" type="image/png" href="img/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Caderneta UFF — app de celular: barra fina no topo, capa ilustrada de Niterói no Início, cartões leves, menu de 5 abas embaixo (mesma estrutura do Brasil 2027) */
:root {
  --papel: #F2F5FA;
  --cartao: #FFFFFF;
  --cartao-2: #EAF0F8;
  --tinta: #0E1A2E;
  --tinta-2: #4A5872;
  --mudo: #7A879C;
  --linha: #DFE6EF;
  --uff: #1A4F9C;
  --uff-2: #3D74C6;
  --uff-suave: #E3ECF8;
  --marca: #E3A81E;
  --marca-suave: #FBF1D6;
  --mac: #C8402E;
  --ok: #1E8550;
  --vs: #B5700A;
  --rep: #C2392D;
  --ok-suave: #DFF2E7;
  --vs-suave: #FBEFD9;
  --rep-suave: #FBE3E0;
  --ext: #A3367A;
  --ext-suave: #F7E1EE;
  --sombra: 0 1px 2px rgba(14, 26, 46, .05), 0 8px 24px rgba(14, 26, 46, .06);
  --raio: 16px;
  --nav-h: 62px;
  --f-titulo: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "Archivo", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #08111F; --cartao: #0F1B2E; --cartao-2: #15243B; --tinta: #E8EEF7; --tinta-2: #AEBBD0; --mudo: #7F8FA8; --linha: #1F2F48;
  --uff: #7FAEF5; --uff-2: #A7C8FA; --uff-suave: #132845; --marca: #F2C14E; --marca-suave: #33290F; --mac: #F07A63;
  --ok: #4CC27E; --vs: #F0A640; --rep: #FF7A6E; --ok-suave: #12301F; --vs-suave: #33250E; --rep-suave: #3A1A17;
  --ext: #F08CC4; --ext-suave: #3A1A2E;
  --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --papel: #08111F; --cartao: #0F1B2E; --cartao-2: #15243B; --tinta: #E8EEF7; --tinta-2: #AEBBD0; --mudo: #7F8FA8; --linha: #1F2F48;
  --uff: #7FAEF5; --uff-2: #A7C8FA; --uff-suave: #132845; --marca: #F2C14E; --marca-suave: #33290F; --mac: #F07A63;
  --ok: #4CC27E; --vs: #F0A640; --rep: #FF7A6E; --ok-suave: #12301F; --vs-suave: #33250E; --rep-suave: #3A1A17;
  --ext: #F08CC4; --ext-suave: #3A1A2E;
  --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 15.5px/1.5 var(--f-texto); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
@supports (overflow-x: clip) { html, body { overflow-x: clip; } }
/* nada pode ficar mais largo que a tela: colunas que encolhem e textos que quebram ou cortam com "…" */
.pagina, #conteudo, .folha, .secao, .cartao, .saiba-in, .capa, .capa-in, .disc, .periodo-grupo, .progresso { grid-template-columns: minmax(0, 1fr); }
.pagina > *, #conteudo > *, .folha > *, .secao > *, .cartao > *, .capa-in > *, .campo, .campos-2 > *, .faixa > * { min-width: 0; }
.campo input, .campo select, .campo textarea { max-width: 100%; min-width: 0; }
.t, .s, .destaque, h1, h2, h3 { overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; letter-spacing: -.015em; }
h2 { font-size: 1.08rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.rotulo { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--mudo); font-weight: 700; }
.fraco { color: var(--tinta-2); }
.pequeno { font-size: .86rem; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--uff); }
:focus-visible { outline: 2px solid var(--uff); outline-offset: 2px; }

/* barra do topo */
.topo { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--cartao) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--linha); }
.topo-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 54px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brasao { height: 34px; width: auto; flex: none; display: block; }
.marca-txt { display: grid; line-height: 1.1; min-width: 0; margin-right: auto; }
.marca-txt strong { font-family: var(--f-titulo); font-weight: 800; font-size: 1.08rem; letter-spacing: -.02em; }
.marca-txt span { font-size: .74rem; color: var(--mudo); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sem { font-family: var(--f-num); font-weight: 700; font-size: .8rem; color: var(--uff); background: var(--uff-suave); padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }

.pagina { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
.titulo-tela { font-size: 1.7rem; font-weight: 800; letter-spacing: -.025em; }
#conteudo { display: grid; gap: 22px; min-width: 0; }

/* seções e cartões */
.secao { display: grid; gap: 10px; min-width: 0; }
.secao-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.secao-cab > p { flex: 1 1 220px; }
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.lista { display: grid; background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; }
.linha { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 14px; min-width: 0; position: relative; }
.linha + .linha::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; border-top: 1px solid var(--linha); }
.linha > div { min-width: 0; }
.linha.clicavel, .clicavel { cursor: pointer; }
.linha.clicavel:active { background: var(--cartao-2); }
.linha .t { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.linha .s { font-size: .84rem; color: var(--tinta-2); overflow-wrap: anywhere; margin-top: 2px; }
.linha .pilula, .linha .nota { justify-self: end; }
.vazio { padding: 16px; color: var(--tinta-2); background: var(--cartao); border-radius: var(--raio); font-size: .92rem; border: 1px dashed var(--linha); }

.dmenos { font-family: var(--f-num); font-weight: 700; font-size: .78rem; min-width: 56px; text-align: center; padding: 5px 6px; border-radius: 10px; background: var(--uff-suave); color: var(--uff); font-variant-numeric: tabular-nums; }
.dmenos.urgente { background: var(--marca); color: #2a1f00; }
.dmenos.perto { background: var(--marca-suave); color: var(--tinta); }
.dmenos.passou { background: var(--cartao-2); color: var(--mudo); }

.pilula { font-size: .74rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--ok-suave); color: var(--ok); }
.p-vs { background: var(--vs-suave); color: var(--vs); }
.p-rep { background: var(--rep-suave); color: var(--rep); }
.p-cur { background: var(--uff-suave); color: var(--uff); }
.p-pen { background: var(--cartao-2); color: var(--mudo); }

.btn { border: 1px solid var(--linha); background: var(--cartao); padding: 9px 14px; border-radius: 12px; font-weight: 600; font-size: .9rem; color: var(--tinta); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { background: var(--cartao-2); }
.btn.forte { background: var(--uff); border-color: var(--uff); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.forte { color: #08111F; } }
:root[data-theme="dark"] .btn.forte { color: #08111F; }
.btn.leve { border-color: transparent; background: var(--uff-suave); color: var(--uff); }
.btn.perigo { color: var(--rep); }
.btn.perigo.armado { background: var(--rep); color: #fff; border-color: var(--rep); }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.acoes-folha { display: flex; gap: 8px; flex-wrap: wrap; }

.marcar { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--linha); background: var(--cartao); display: grid; place-items: center; padding: 0; color: #fff; font-weight: 800; }
.marcar.feito { background: var(--ok); border-color: var(--ok); }
.feito-txt .t { text-decoration: line-through; color: var(--mudo); }

.barra { height: 8px; border-radius: 999px; background: var(--cartao-2); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--uff), var(--uff-2)); }

/* capa do Início: Niterói em camadas */
.capa { position: relative; isolation: isolate; border-radius: 22px; overflow: hidden; color: #fff; min-height: 312px; display: grid; align-content: end; box-shadow: var(--sombra);
  max-width: 100%; }
.capa svg.cena { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
.capa::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5, 12, 26, .05) 0%, rgba(5, 12, 26, .12) 38%, rgba(5, 12, 26, .78) 100%); }
.capa-in { padding: 18px; display: grid; gap: 10px; }
.capa .ola { font-size: .86rem; font-weight: 600; color: rgba(255, 255, 255, .86); }
.capa .destaque { font-family: var(--f-titulo); font-weight: 800; font-size: 1.55rem; line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
.capa .destaque small { display: block; font-family: var(--f-texto); font-weight: 600; font-size: .9rem; letter-spacing: 0; color: rgba(255, 255, 255, .85); margin-top: 4px; }
.vidros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.vidro { background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 14px; padding: 8px 10px; display: grid; gap: 0; min-width: 0; }
.vidro b { font-family: var(--f-num); font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.vidro span { font-size: .72rem; color: rgba(255, 255, 255, .82); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* atalhos do Início */
.atalhos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.atalho { border: 0; background: var(--cartao); box-shadow: var(--sombra); border-radius: 14px; padding: 12px 6px; display: grid; justify-items: center; gap: 4px; font-weight: 700; font-size: .8rem; color: var(--tinta); }
.atalho svg { width: 22px; height: 22px; stroke: var(--uff); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* faixa com a próxima data da UFF */
.faixa { display: flex; align-items: center; gap: 10px; min-width: 0; background: var(--marca-suave); border-radius: 14px; padding: 10px 14px; font-size: .88rem; }
.faixa b { font-family: var(--f-num); color: var(--tinta); white-space: nowrap; }
.faixa span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); }

/* linha do tempo do dia */
.hora { font-family: var(--f-num); font-size: .84rem; font-weight: 700; min-width: 46px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.tempo .linha { grid-template-columns: 46px 4px minmax(0, 1fr) auto; }
.tempo .fio { align-self: stretch; width: 4px; border-radius: 4px; background: var(--uff); }
.fio.c-prova { background: var(--marca); }
.fio.c-ext { background: var(--ext); }
.fio.c-uff { background: var(--mudo); }
.fio.c-estudo { background: var(--uff-2); opacity: .6; }

/* ícone das matérias e certificados */
.ico { --c: var(--uff); width: 42px; height: 42px; border-radius: 13px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, var(--cartao)); color: var(--c); }
.ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.p { width: 34px; height: 34px; border-radius: 10px; }
.ico.p svg { width: 18px; height: 18px; }

/* chave Este período / Curso todo */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--cartao-2); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px 6px; font-weight: 700; font-size: .88rem; color: var(--tinta-2); }
.seg button[aria-pressed="true"] { background: var(--cartao); color: var(--tinta); box-shadow: 0 1px 3px rgba(14, 26, 46, .12); }

/* cartão de matéria do período */
.disc { background: var(--cartao); border-radius: 18px; box-shadow: var(--sombra); overflow: hidden; }
.disc-cab { padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.disc-cab > div { min-width: 0; }
.disc-cab h3 { font-size: 1.02rem; line-height: 1.25; }
.disc-cab .cod { font-size: .78rem; color: var(--mudo); font-weight: 600; }
.disc .lista { box-shadow: none; border-radius: 0; background: transparent; border-top: 1px solid var(--linha); }
.nota { font-family: var(--f-num); font-weight: 800; font-size: 1.05rem; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.nota.vazia { color: var(--mudo); font-weight: 600; font-size: .86rem; }
.disc-pe { padding: 12px 14px; background: var(--cartao-2); display: grid; gap: 3px; }
.disc-pe .media { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.disc-pe .media b { font-family: var(--f-num); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.disc-acoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 14px 14px; background: var(--cartao-2); }
.disc-acoes .btn { padding: 8px 6px; }

/* curso todo */
.progresso { display: grid; gap: 10px; }
.progresso .grande { display: flex; align-items: baseline; gap: 8px; }
.progresso .grande b { font-family: var(--f-num); font-weight: 800; font-size: 2.3rem; letter-spacing: -.03em; line-height: 1; }
.faltas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.falta { background: var(--cartao-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px; }
.falta b { font-family: var(--f-num); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.falta span { font-size: .78rem; color: var(--tinta-2); }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.filtro { flex: none; border: 1px solid var(--linha); background: var(--cartao); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 700; color: var(--tinta-2); }
.filtro[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.periodo-grupo { display: grid; gap: 8px; }
.periodo-grupo > h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--mudo); font-family: var(--f-texto); }

/* calendário */
.mes-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mes-cab h2 { font-size: 1.25rem; text-transform: capitalize; }
.mes-nav { display: flex; gap: 6px; }
.mes-nav .btn { padding: 7px 12px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--cartao); border-radius: 18px; box-shadow: var(--sombra); padding: 10px 8px; }
.cal .sem-d { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mudo); text-align: center; padding-bottom: 4px; }
.dia { border: 0; background: none; border-radius: 12px; min-height: 48px; padding: 6px 2px; display: grid; align-content: start; justify-items: center; gap: 4px; color: var(--tinta); }
.dia.fora { color: var(--mudo); opacity: .45; }
.dia .n { font-family: var(--f-num); font-size: .92rem; font-weight: 600; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.dia.hoje .n { background: var(--uff); color: #fff; font-weight: 800; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dia.hoje .n { color: #08111F; } }
:root[data-theme="dark"] .dia.hoje .n { color: #08111F; }
.dia[aria-pressed="true"] { background: var(--uff-suave); }
.dia.sem-aula .n { color: var(--mudo); text-decoration: line-through; }
.dia.hoje.sem-aula .n { text-decoration: none; color: #fff; }
.pontos { display: flex; gap: 3px; justify-content: center; min-height: 6px; }
.ponto { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.c-prova { background: var(--marca); }
.c-estudo { background: var(--uff-2); opacity: .55; }
.c-facul { background: var(--uff); }
.c-ext { background: var(--ext); }
.c-uff { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mudo); }
.legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--tinta-2); }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }

/* "Saiba mais": explicações guardadas, abre quem quiser */
.saiba { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); }
.saiba > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.saiba > summary::-webkit-details-marker { display: none; }
.saiba > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--mudo); border-bottom: 2px solid var(--mudo); transform: rotate(45deg); transition: transform .2s; flex: none; margin-top: -4px; }
.saiba[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
.saiba-in { padding: 0 16px 16px; display: grid; gap: 10px; }
.info-linhas { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.info-linhas li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: .92rem; }
.info-linhas .quando { font-family: var(--f-num); font-size: .8rem; font-weight: 700; color: var(--uff); white-space: nowrap; font-variant-numeric: tabular-nums; }
.info-linhas.texto li { grid-template-columns: 1fr; gap: 1px; }
.info-linhas strong { font-weight: 700; }
.fonte { font-size: .76rem; color: var(--mudo); }
.tabela-he { border-top: 1px solid var(--linha); padding-top: 8px; }
.tabela-he summary { cursor: pointer; font-weight: 700; color: var(--uff); padding-block: 4px; }
.tabela-he ul { margin-top: 8px; }

/* certificados */
.aneis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.anel { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.anel svg { width: 54px; height: 54px; transform: rotate(-90deg); }
.anel circle { fill: none; stroke-width: 6; }
.anel .fundo-anel { stroke: var(--cartao-2); }
.anel .cheio { stroke: var(--uff); stroke-linecap: round; }

<script>
"use strict";
/* ---------- estado ---------- */
const VERSAO_APP = "2026-10-24-11"; // trocar junto com dados/versao.json a cada publicação do app
const S = { discs: new Map(), avals: new Map(), avisos: new Map(), eventos: new Map(), perfil: {}, aba: "hoje", filtroCurso: "todas", mes: null, diaSel: null };
let db = null, sample = null, podeEscrever = true;

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hojeISO = () => { const d = new Date(); return iso(d); };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const deISO = (s) => { const [a, m, d] = String(s).split("-").map(Number); return new Date(a, (m || 1) - 1, d || 1); };
const diasAte = (s) => Math.round((deISO(s) - deISO(hojeISO())) / 86400000);
const somaDias = (s, n) => { const d = deISO(s); d.setDate(d.getDate() + n); return iso(d); };
const SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const dataCurta = (s) => { if (!s) return "sem data"; const d = deISO(s); return `${SEMANA[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`; };
const nota1 = (n) => (n == null || n === "" || Number.isNaN(Number(n))) ? "—" : Number(n).toFixed(1).replace(".", ",");
const lerNota = (t) => { if (t == null) return null; const s = String(t).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return Number.isFinite(n) && n >= 0 && n <= 10 ? Math.round(n * 10) / 10 : NaN; };
function chipDias(s) {
  if (!s) return `<span class="dmenos passou">s/ data</span>`;
  const n = diasAte(s);
  if (n < 0) return `<span class="dmenos passou">há ${-n} d</span>`;
  if (n === 0) return `<span class="dmenos urgente">HOJE</span>`;
  if (n === 1) return `<span class="dmenos urgente">amanhã</span>`;
  return `<span class="dmenos ${n <= 3 ? "urgente" : n <= 7 ? "perto" : ""}">D-${n}</span>`;
}
const nomeDisc = (id) => S.discs.get(id)?.nome || "Disciplina";
const ordenarPor = (arr, f) => arr.slice().sort((a, b) => (f(a) < f(b) ? -1 : f(a) > f(b) ? 1 : 0));

/* ---------- regras da UFF (Regulamento dos Cursos de Graduação, Res. CEP 001/2015, arts. 96 e 99) ---------- */
function situacaoDisc(id) {
  const avs = [...S.avals.values()].filter((a) => a.disciplinaId === id);
  const regulares = avs.filter((a) => a.tipo !== "vs");
  const vs = avs.find((a) => a.tipo === "vs");
  const pesoTotal = regulares.reduce((s, a) => s + (Number(a.peso) || 1), 0);
  const comNota = regulares.filter((a) => a.nota != null);
  const pesoFeito = comNota.reduce((s, a) => s + (Number(a.peso) || 1), 0);
  const pontos = comNota.reduce((s, a) => s + (Number(a.peso) || 1) * a.nota, 0);
  const r = { avs, regulares, vs, pesoTotal, pesoFeito, media: null, parcial: null, texto: "", classe: "p-cur", rotulo: "Cursando" };
  if (!regulares.length) { r.texto = "Cadastre as provas e trabalhos desta matéria para acompanhar a média."; return r; }
  if (pesoFeito > 0) r.parcial = pontos / pesoFeito;
  if (pesoFeito < pesoTotal) {
    const falta = pesoTotal - pesoFeito;
    const precisa6 = (6 * pesoTotal - pontos) / falta;
    const precisa4 = (4 * pesoTotal - pontos) / falta;
    if (!comNota.length) r.texto = "Para passar direto, a média das avaliações precisa ficar em 6,0 ou mais.";
    else if (precisa6 <= 0) { r.texto = "Você já garantiu a média 6,0, mesmo tirando zero no que falta."; r.classe = "p-ok"; r.rotulo = "Garantido"; }
    else if (precisa6 <= 10) r.texto = `Para passar direto, precisa de média ${nota1(precisa6)} no que falta.`;
    else if (precisa4 <= 10) { r.texto = `Não dá mais para passar direto. Para ir à VS, precisa de média ${nota1(Math.max(precisa4, 0))} no que falta.`; r.classe = "p-vs"; r.rotulo = "Rumo à VS"; }
    else { r.texto = "Mesmo com 10 no que falta, a média não chega a 4,0."; r.classe = "p-rep"; r.rotulo = "Em risco"; }
    return r;
  }
  r.media = pontos / pesoTotal;
  if (r.media >= 6) { r.texto = "Média 6,0 ou mais: aprovado direto (com frequência de 75%)."; r.classe = "p-ok"; r.rotulo = "Aprovado"; }
  else if (r.media >= 4) {
    if (vs && vs.nota != null) {
      if (vs.nota >= 6) { r.texto = `VS ${nota1(vs.nota)}: aprovado (a VS precisa de 6,0).`; r.classe = "p-ok"; r.rotulo = "Aprovado na VS"; }
      else { r.texto = `VS ${nota1(vs.nota)}: abaixo de 6,0.`; r.classe = "p-rep"; r.rotulo = "Reprovado"; }
    } else { r.texto = "Média entre 4,0 e 5,9: vai para a VS e precisa tirar 6,0 nela."; r.classe = "p-vs"; r.rotulo = "VS"; }
  } else { r.texto = "Média abaixo de 4,0: reprovado sem direito a VS."; r.classe = "p-rep"; r.rotulo = "Reprovado"; }
  return r;
}

const SITUACOES = { "a-conferir": ["A conferir", "p-pen"], aprovado: ["Aprovado", "p-ok"], cursando: ["Cursando", "p-cur"], pendente: ["Falta cursar", "p-pen"], reprovado: ["Reprovado", "p-rep"], trancado: ["Trancado", "p-pen"] };

/* ---------- horários de aula: "seg 14:00-16:00; qua 14:00-16:00" ---------- */
const DIAS_TXT = { dom: 0, seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6, "sáb": 6 };
function lerHorarios(t) {
  const out = [];
  for (const m of String(t || "").toLowerCase().matchAll(/(dom|seg|ter|qua|qui|sex|s[aá]b)\D*?(\d{1,2})[:h](\d{2})\s*(?:-|–|\/|a|às)\s*(\d{1,2})[:h](\d{2})/g)) {
    out.push({ dia: DIAS_TXT[m[1]], inicio: `${m[2].padStart(2, "0")}:${m[3]}`, fim: `${m[4].padStart(2, "0")}:${m[5]}` });
  }
  return out;
}
const escreverHorarios = (hs) => (hs || []).map((h) => `${SEMANA[h.dia]} ${h.inicio}-${h.fim}`).join("; ");
const horaCurta = (t) => { const [h, m] = String(t).split(":"); return `${Number(h)}h${m && m !== "00" ? m : ""}`; };
function mostrarHorarios(hs) {
  const grupos = new Map();
  for (const h of hs || []) { const k = `${horaCurta(h.inicio)}–${horaCurta(h.fim)}`; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(SEMANA[h.dia]); }
  return [...grupos].map(([k, dias]) => `${dias.join(" e ")}, ${k}`).join(" · ");
}

/* ---------- agenda: tudo o que cai num dia ---------- */
function dentroDoSemestre(d) {
  const { inicioSemestre: i, fimSemestre: f } = S.perfil;
  return (!i || d >= i) && (!f || d <= f);
}
/* calendário oficial da UFF (vem no arquivo de dados do site) */
const datasUff = () => (typeof BASE !== "undefined" && BASE.calendarioUff?.datas) || [];
const fonteUff = () => (typeof BASE !== "undefined" && BASE.calendarioUff?.fonte) || "";
const semAula = (d) => datasUff().some((x) => x.tipo === "feriado" && x.data === d);
function uffNoDia(d) {
  const out = [];
  for (const x of datasUff()) {
    if (x.data === d) out.push(x.fim ? `${x.titulo}: começa hoje, vai até ${dataCurta(x.fim)}` : x.titulo);
    else if (x.fim === d) out.push(`${x.titulo}: termina hoje`);
  }
  return out;
}
function itensDoDia(d) {
  const out = [];
  const dow = deISO(d).getDay();
  for (const t of uffNoDia(d)) out.push({ cor: "c-uff", hora: "UFF", titulo: t, sub: "Calendário oficial da UFF", acao: "", id: "" });
  for (const a of S.avals.values()) if (a.data === d) out.push({ cor: "c-prova", hora: a.hora || "", titulo: `${a.nome} · ${nomeDisc(a.disciplinaId)}`, sub: a.nota != null ? "nota " + nota1(a.nota) : (a.conteudo || "Prova"), acao: "editar-aval", id: a.id });
  for (const e of S.eventos.values()) {
    const repete = e.repeteAte && d >= e.data && d <= e.repeteAte && diasAte(d) - diasAte(e.data) >= 0 && (diasAte(d) - diasAte(e.data)) % 7 === 0;
    if (e.data === d || repete) out.push({ cor: e.categoria === "externo" ? "c-ext" : "c-facul", hora: e.hora || "", titulo: e.titulo, sub: [e.horaFim ? "até " + e.horaFim : "", e.local, e.categoria === "externo" ? "Fora da faculdade" : "Faculdade"].filter(Boolean).join(" · "), acao: "editar-evento", id: e.id });
  }
  if (dentroDoSemestre(d) && !semAula(d)) for (const disc of S.discs.values()) {
    if (disc.situacao !== "cursando") continue;
    for (const h of disc.horarios || []) if (h.dia === dow) out.push({ cor: "c-facul", hora: h.inicio, titulo: `Aula · ${disc.nome}`, sub: [`até ${h.fim}`, disc.professor, disc.turma ? "turma " + disc.turma : ""].filter(Boolean).join(" · "), acao: "editar-disc", id: disc.id, aula: true, disc: disc.nome, fim: h.fim });
  }
  for (const v of S.avisos.values()) if (v.data === d && !v.feito) out.push({ cor: "c-estudo", hora: "", titulo: v.texto, sub: v.disciplinaId ? "Estudo · " + nomeDisc(v.disciplinaId) : "Estudo", acao: "editar-aviso", id: v.id });
  const chave = (i) => (i.cor === "c-uff" ? "00" : i.hora || "99");
  return out.sort((a, b) => (chave(a) < chave(b) ? -1 : chave(a) > chave(b) ? 1 : 0));
}
const ddmm = (s) => String(s).split("-").reverse().slice(0, 2).join("/");
// "Saiba mais": explicação guardada num bloco que abre e fecha
function saiba(titulo, corpo, fonte, aberto) {
  return `<details class="saiba"${aberto ? " open" : ""}><summary>${titulo}</summary><div class="saiba-in">${corpo}${fonte ? `<div class="fonte">${fonte}</div>` : ""}</div></details>`;
}
const cartaoUff = (titulo, corpo, fonte) => saiba(titulo, corpo, fonte);
function listaDatasUff(itens) {
  const h = hojeISO();
  return `<ul class="info-linhas">${itens.map((x) => {
    const quando = x.fim ? (x.data <= h ? "até " + ddmm(x.fim) : `${ddmm(x.data)}–${ddmm(x.fim)}`) : ddmm(x.data);
    const passou = (x.fim || x.data) < h;
    return `<li${passou ? ' style="opacity:.5"' : ""}><span class="quando">${quando}</span><span>${esc(x.titulo)}</span></li>`;
  }).join("")}</ul>`;
}
function proximaDataUff() {
  const h = hojeISO();
  const chave = (x) => (x.data >= h ? x.data : x.fim);
  return datasUff().filter((x) => (x.fim || x.data) >= h).sort((a, b) => (chave(a) < chave(b) ? -1 : 1))[0] || null;
}

/* ---------- ícones (traço simples, cor por área) ---------- */
const ICONES = {
  mat: '<path d="M15 4.5c-1.6-1-3.4-.2-3.8 2L9.8 17.5c-.4 2.2-2.2 3-3.8 2"/><path d="M14 11h5M16.5 8.5v5"/>',
  fis: '<ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.2"/>',
  qui: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 14h9"/>',
  lab: '<path d="M5 3h6M6 3v12.5a2.5 2.5 0 0 0 5 0V3M6 9h5"/><path d="M13 3h6M14 3v12.5a2.5 2.5 0 0 0 5 0V3M14 12h5"/>',
  flu: '<path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>',

const CORES_ICO = { mat: "#5B5BD6", fis: "#0E8F86", qui: "#2E8B57", lab: "#3B9C6B", flu: "#1C8FC9", termo: "#D9692B", reator: "#8A4FD1", proc: "#3E6FB0", seg: "#C4453A", neg: "#B8860B", prog: "#4C5BD4", des: "#6B7A90", est: "#1A4F9C", livro: "#1A4F9C", mic: "#D9692B", fabrica: "#3E6FB0", pessoas: "#0E8F86", palco: "#8A4FD1", medalha: "#B8860B" };
const semAcento = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function tipoDisc(nome) {
  const n = semAcento(nome);
  const regras = [["seg", /seguranca|meio ambiente|higiene/], ["neg", /empreend|administra|economia|gestao/], ["prog", /programacao|computad/], ["des", /desenho/],
    ["lab", /experimental|laborat/], ["reator", /reac|reator|cinetica|bioquim/], ["termo", /termodin|calor/], ["flu", /fluido|massa|fenomeno|transferencia/],
    ["proc", /operac|processo|simulac|desenvolvimento|projeto da ind|controle|instrument|instalac|materiais de constr|offshore/], ["mat", /calculo|algebra|matemat|metodos|estatistic|geometr/],
    ["fis", /fisica|eletrotec|mecanica dos materiais/], ["qui", /quimic|organic|inorganic|analitic/], ["est", /estagio|projeto final|atividade|eletiva|optativa|extens|cidadania/]];
  for (const [k, re] of regras) if (re.test(n)) return k;
  return "livro";
}
const svgIco = (tipo) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[tipo] || ICONES.livro}</svg>`;
const icone = (tipo, pequeno) => `<span class="ico${pequeno ? " p" : ""}" style="--c:${CORES_ICO[tipo] || CORES_ICO.livro}" aria-hidden="true">${svgIco(tipo)}</span>`;
const iconeDisc = (d, pequeno) => icone(tipoDisc(d?.nome), pequeno);

/* ---------- capa do Início: Niterói em camadas, com o céu da hora do dia ---------- */
function cenaNiteroi() {
  const h = new Date().getHours();
  const P = h >= 5 && h < 11 ? { c1: "#5EA6EE", c2: "#F5DDB0", sol: "#FFD36B", sx: 66, sy: 74, longe: "#86A9D2", meio: "#2F5C93", perto: "#173E70", mar1: "#3E7EC0", mar2: "#1B4C88", luz: "#1A2C4A" }
    : h >= 11 && h < 16 ? { c1: "#2A78D8", c2: "#A9D3FF", sol: "#FFE08A", sx: 300, sy: 46, longe: "#74A1D3", meio: "#2A5A97", perto: "#123869", mar1: "#2F78C8", mar2: "#164887", luz: "#1A2C4A" }
    : h >= 16 && h < 19 ? { c1: "#26387C", c2: "#F2925A", sol: "#FFB36B", sx: 186, sy: 158, longe: "#5E4F88", meio: "#2C2F6A", perto: "#18204A", mar1: "#C8735C", mar2: "#283066", luz: "#FFD27A" }
    : { c1: "#0A1A42", c2: "#2E559C", sol: "#F3E7C4", sx: 330, sy: 58, longe: "#4A6AA5", meio: "#24477F", perto: "#14305C", mar1: "#2A4E8C", mar2: "#0F2550", luz: "#FFD27A" };
  const noite = h >= 19 || h < 5;
  const estrelas = noite ? [[30, 30], [70, 58], [110, 22], [160, 46], [210, 18], [250, 64], [370, 28], [390, 80], [140, 80], [52, 96]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 0.9 : 1.4}" fill="#fff" opacity="${i % 2 ? 0.6 : 0.9}"/>`).join("") : "";
  return `<svg class="cena" viewBox="0 34 400 234" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <defs><linearGradient id="ceu-${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.c1}"/><stop offset="1" stop-color="${P.c2}"/></linearGradient>
      <linearGradient id="mar-${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.mar1}"/><stop offset="1" stop-color="${P.mar2}"/></linearGradient></defs>
    <rect width="400" height="268" fill="url(#ceu-${h})"/>${estrelas}
    <circle cx="${P.sx}" cy="${P.sy}" r="34" fill="${P.sol}" opacity=".18"/><circle cx="${P.sx}" cy="${P.sy}" r="15" fill="${P.sol}"/>
    <path d="M52 170 C74 150 96 120 114 104 L118 97 L122 104 C140 122 160 150 178 170 Z" fill="${P.longe}"/>
    <path d="M118 84v10M114.5 88h7" stroke="${P.longe}" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 170 C184 146 196 132 208 135 C216 138 221 150 225 157 C233 140 244 113 260 111 C277 111 286 142 293 170 Z" fill="${P.longe}"/>
    <rect y="168" width="400" height="100" fill="url(#mar-${h})"/>
    <path d="M30 196h34M118 206h44M232 190h24M286 222h42M84 236h30" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".22"/>
    <path d="M-10 268 L-10 150 C22 128 60 112 92 118 C122 124 142 152 166 190 C178 212 188 240 194 268 Z" fill="${P.meio}"/>
    <path d="M140 84 L166 80 L152 91 Z" fill="#fff" opacity=".92"/><path d="M152 91 L153 98" stroke="#fff" stroke-width="1.2" opacity=".9"/>
    <path d="M232 268 C236 230 258 210 298 207 C342 205 382 216 412 238 L412 268 Z" fill="${P.perto}"/>
    <ellipse cx="325" cy="208" rx="40" ry="4.5" fill="${P.mar1}" opacity=".75"/>
    <rect x="316" y="171" width="18" height="36" rx="3" fill="#E7EBF2"/>
    <path d="M262 154 C292 145 358 145 388 154 L371 173 C350 179 300 179 279 173 Z" fill="#F4F6FA"/>
    <path d="M268 159 C298 151 352 151 382 159 L379 163 C352 157 298 157 271 163 Z" fill="${P.luz}" opacity=".85"/>
    <path d="M238 240 C262 236 272 224 290 216 C306 209 302 197 317 190" fill="none" stroke="#D4442F" stroke-width="3.4" stroke-linecap="round"/>
  </svg>`;
}
function capaInicio(proximas, rc) {
  const agora = new Date(), h = agora.getHours();
  const ola = h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  const DIAS_LONGOS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  const hoje = hojeISO(), hd = deISO(hoje);
  const hm = `${String(h).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;
  const aulas = itensDoDia(hoje).filter((i) => i.aula);
  const prox = aulas.find((i) => i.fim > hm);
  const p = proximas[0];
  let titulo, sub;
  if (p && diasAte(p.data) <= 10) {
    const n = diasAte(p.data);
    titulo = `${esc(p.nome)} de ${esc(nomeDisc(p.disciplinaId))} ${n === 0 ? "é hoje" : n === 1 ? "é amanhã" : `em ${n} dias`}`;
    sub = `${dataCurta(p.data)}${p.hora ? " às " + horaCurta(p.hora) : ""}`;
  } else if (prox) {
    titulo = prox.hora <= hm ? `Em aula até ${horaCurta(prox.fim)}` : `Próxima aula às ${horaCurta(prox.hora)}`;
    sub = esc(prox.disc);
  } else if (semAula(hoje)) {
    titulo = "Hoje não tem aula";
    sub = esc(datasUff().find((x) => x.data === hoje)?.titulo.split(" · ")[0] || "Feriado");
  } else if (aulas.length) {
    titulo = "As aulas de hoje acabaram";
    sub = p ? `Próxima prova: ${esc(p.nome)} de ${esc(nomeDisc(p.disciplinaId))}, ${dataCurta(p.data)}` : "Bom momento para revisar";
  } else {
    titulo = "Dia sem aulas";
    sub = p ? `Próxima prova: ${esc(p.nome)}, ${dataCurta(p.data)}` : "Aproveite para adiantar o estudo";
  }
  const pct = rc.chTotal ? Math.round((rc.chAprov / rc.chTotal) * 100) : null;
  return `<section class="capa" aria-label="Resumo de hoje">${cenaNiteroi()}
    <div class="capa-in">
      <p class="ola">${ola} · ${DIAS_LONGOS[hd.getDay()]}, ${hd.getDate()} de ${NOMES_MES[hd.getMonth()]}</p>
      <p class="destaque">${titulo}<small>${sub}</small></p>
      <div class="vidros">
        <div class="vidro"><b>${esc(rc.cr ?? "—")}</b><span>CR</span></div>
        <div class="vidro"><b>${pct == null ? "—" : pct + "%"}</b><span>do curso</span></div>
        <div class="vidro"><b>${rc.cursando.length}</b><span>matérias</span></div>
      </div>
    </div></section>`;
}

function linhaAgenda(i) {
  const titulo = i.aula ? i.disc : i.titulo;
  const sub = i.aula ? "Aula · " + i.sub : i.sub;
  const hora = i.cor === "c-uff" ? "UFF" : i.hora ? horaCurta(i.hora) : "—";
  return `<div class="linha ${i.acao ? "clicavel" : ""}" ${i.acao ? `data-acao="${i.acao}" data-id="${esc(i.id)}"` : ""}><span class="hora">${hora}</span><span class="fio ${i.cor}"></span>
    <div><div class="t">${esc(titulo)}</div><div class="s">${esc(sub)}</div></div><span></span></div>`;
}
function resumoCurso() {
  const ds = [...S.discs.values()].filter((d) => d.tipo !== "optativa-extra");
  const ch = (d) => Number(d.cargaHoraria) || 0;
  const chTotal = Number(S.perfil.chTotal) || ds.filter((d) => d.tipo !== "optativa").reduce((s, d) => s + ch(d), 0);
  const chAprov = Number(S.perfil.chObtida) || ds.filter((d) => d.situacao === "aprovado").reduce((s, d) => s + ch(d), 0);
  const comNota = ds.filter((d) => (d.situacao === "aprovado" || d.situacao === "reprovado") && d.notaFinal != null && ch(d) > 0);
  const chN = comNota.reduce((s, d) => s + ch(d), 0);
  const cr = S.perfil.crOficial || (chN ? (comNota.reduce((s, d) => s + d.notaFinal * ch(d), 0) / chN).toFixed(1).replace(".", ",") : null);
  return { chTotal, chAprov, cr, aprovadas: ds.filter((d) => d.situacao === "aprovado").length, faltam: ds.filter((d) => d.situacao === "pendente").length, cursando: ds.filter((d) => d.situacao === "cursando") };
}

function irPara(aba) {
  S.aba = TITULOS[aba] ? aba : "hoje";
  document.querySelectorAll(".aba").forEach((x) => x.dataset.aba === S.aba ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));

  render(); window.scrollTo(0, 0);
}

const NOMES_MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function telaAgenda() {
  const h = hojeISO();
  if (!S.mes) S.mes = h.slice(0, 7);
  if (!S.diaSel) S.diaSel = h;
  const [ano, mes] = S.mes.split("-").map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const inicio = new Date(primeiro); inicio.setDate(1 - primeiro.getDay());
  let grade = SEMANA.map((s) => `<div class="sem-d">${s.slice(0, 1).toUpperCase()}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + k);
    if (k >= 35 && d.getMonth() !== mes - 1) break;
    const di = iso(d);
    const itens = itensDoDia(di);
    const cores = [...new Set(itens.map((i) => i.cor))].slice(0, 4);
    grade += `<button class="dia ${d.getMonth() !== mes - 1 ? "fora" : ""} ${di === h ? "hoje" : ""} ${semAula(di) ? "sem-aula" : ""}" data-acao="dia" data-d="${di}" aria-pressed="${di === S.diaSel}" aria-label="${d.getDate()} de ${NOMES_MES[d.getMonth()]}, ${itens.length} itens">
      <span class="n">${d.getDate()}</span><span class="pontos">${cores.map((c) => `<i class="ponto ${c}"></i>`).join("")}</span></button>`;
  }
  const itensSel = itensDoDia(S.diaSel);
  return `<section class="secao">
    <div class="mes-cab"><h2>${NOMES_MES[mes - 1]} ${ano}</h2><div class="mes-nav"><button class="btn" data-acao="mes" data-passo="-1" aria-label="Mês anterior">‹</button><button class="btn" data-acao="mes" data-passo="0">Hoje</button><button class="btn" data-acao="mes" data-passo="1" aria-label="Próximo mês">›</button></div></div>
    <div class="cal">${grade}</div>
    <div class="legenda"><span><i class="ponto c-facul"></i>Aula</span><span><i class="ponto c-prova"></i>Prova</span><span><i class="ponto c-ext"></i>Fora da UFF</span><span><i class="ponto c-estudo"></i>Estudo</span><span><i class="ponto c-uff"></i>Data da UFF</span></div>
  </section>
  <section class="secao"><div class="secao-cab"><h2 style="text-transform:capitalize">${dataCurta(S.diaSel)}</h2><button class="btn leve" data-acao="novo-evento">${svgIco("mais")} Compromisso</button></div>
    ${itensSel.length ? `<div class="lista tempo">${itensSel.map(linhaAgenda).join("")}</div>` : `<div class="vazio">Dia livre.</div>`}
  </section>
  ${datasUff().length ? saiba(`Datas da UFF em ${esc(S.perfil.semestreAtual || "2026.2")}`, listaDatasUff(datasUff()) + `<p class="pequeno fraco">Nos feriados e pontos facultativos o calendário já tira as aulas.</p>`, "Fonte: " + esc(fonteUff())) : ""}` + rodape();
}

function telaHoje() {
  const h = hojeISO();
  const proximas = ordenarPor([...S.avals.values()].filter((a) => a.data && a.data >= h && a.nota == null), (a) => a.data);
  const avisos = ordenarPor([...S.avisos.values()].filter((v) => !v.feito && v.data && v.data <= h), (v) => v.data);
  let out = capaInicio(proximas, resumoCurso());
  const atalho = (acao, t, ic) => `<button class="atalho" data-acao="${acao}">${svgIco(ic)}${t}</button>`;
  out += `<div class="atalhos">${atalho("nova-aval", "Prova", "prova")}${atalho("novo-evento", "Compromisso", "cal")}${atalho("novo-aviso", "Estudo", "check")}</div>`;
  const ud = proximaDataUff();
  if (ud) out += `<div class="faixa clicavel" data-acao="ir" data-ir="agenda"><b>${ud.fim && ud.data <= h ? "até " + ddmm(ud.fim) : ddmm(ud.data)}</b><span>${esc(ud.titulo)}</span></div>`;
  const agendaHoje = itensDoDia(h).filter((i) => i.cor !== "c-estudo" && i.cor !== "c-uff");
  out += `<section class="secao"><h2>Hoje</h2>${agendaHoje.length ? `<div class="lista tempo">${agendaHoje.map(linhaAgenda).join("")}</div>` : `<div class="vazio">Nada marcado para hoje.</div>`}</section>`;
  if (avisos.length) out += `<section class="secao"><h2>Estudar</h2><div class="lista">${avisos.map(linhaAviso).join("")}</div></section>`;
  if (proximas.length) out += `<section class="secao"><h2>Próximas provas</h2><div class="lista">${proximas.slice(0, 4).map(linhaAval).join("")}</div></section>`;
  return out + rodape();
}

function linhaAval(a) {
  const d = S.discs.get(a.disciplinaId);

    ${a.nota == null ? chipDias(a.data) : `<span class="nota">${nota1(a.nota)}</span>`}</div>`;
}
function linhaAviso(v) {

    <div class="clicavel" data-acao="editar-aviso" data-id="${esc(v.id)}"><div class="t">${esc(v.texto)}</div>
    <div class="s">${atrasado ? '<strong style="color:var(--rep)">atrasado · </strong>' : ""}${dataCurta(v.data)}${v.disciplinaId ? " · " + esc(nomeDisc(v.disciplinaId)) : ""}</div></div>
    <span></span></div>`;
}

function telaMaterias() {
  const sub = S.subMat === "curso" ? "curso" : "periodo";
  return `<div class="seg" role="group" aria-label="Ver"><button data-acao="sub" data-sub="periodo" aria-pressed="${sub === "periodo"}">Este período</button><button data-acao="sub" data-sub="curso" aria-pressed="${sub === "curso"}">Curso todo</button></div>`
    + (sub === "curso" ? telaCurso() : telaPeriodo());
}

function telaPeriodo() {
  const cursando = ordenarPor([...S.discs.values()].filter((d) => d.situacao === "cursando"), (d) => d.nome);
  let out = `<div class="secao-cab"><h2>${cursando.length} ${cursando.length === 1 ? "matéria" : "matérias"}${S.perfil.semestreAtual ? " em " + esc(S.perfil.semestreAtual) : ""}</h2><button class="btn leve" data-acao="nova-disc" data-sit="cursando">${svgIco("mais")} Matéria</button></div>`;
  if (!cursando.length) return out + `<div class="vazio">Nenhuma matéria marcada como “cursando”.</div>` + rodape();
  for (const d of cursando) {
    const r = situacaoDisc(d.id);
    const avs = ordenarPor(r.avs, (a) => (a.tipo === "vs" ? "z" : "") + (a.data || "9999"));
    out += `<article class="disc">
      <div class="disc-cab">${iconeDisc(d)}<div><h3>${esc(d.nome)}</h3>
        <div class="pequeno fraco">${[d.professor ? esc(d.professor) : "", esc(mostrarHorarios(d.horarios))].filter(Boolean).join(" · ")}</div></div>
        <span class="pilula ${r.classe}">${r.rotulo}</span></div>
      ${avs.length ? `<div class="lista">${avs.map((a) => `<div class="linha clicavel" data-acao="editar-aval" data-id="${esc(a.id)}">${a.nota == null ? chipDias(a.data) : `<span class="dmenos passou">feita</span>`}
        <div><div class="t">${esc(a.nome)}${a.tipo === "vs" || Number(a.peso ?? 1) === 1 ? "" : ` <span class="fraco pequeno">peso ${esc(a.peso)}</span>`}</div><div class="s">${dataCurta(a.data)}</div></div>

function telaCurso() {
  const rc = resumoCurso();
  const pct = rc.chTotal ? Math.min(100, (rc.chAprov / rc.chTotal) * 100) : 0;
  const fl = S.perfil.faltas || {};
  const f = S.filtroCurso;
  const todas = [...S.discs.values()].filter((d) => f === "todas" || d.situacao === f);
  const grupos = new Map();
  for (const d of todas) { const k = d.periodo ? Number(d.periodo) : 99; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(d); }
  let out = `<section class="cartao progresso"><span class="rotulo">Curso feito</span>
    <div class="grande"><b>${Math.round(pct)}%</b><span class="fraco">${rc.chAprov} de ${rc.chTotal || "?"} h</span></div>
    <div class="barra" role="img" aria-label="${Math.round(pct)}% do curso"><i style="width:${pct}%"></i></div>
    <p class="pequeno fraco">CR ${esc(rc.cr ?? "—")}${fl.obrigatorias ? ` · faltam ${fl.obrigatorias} h de matérias obrigatórias` : ""}</p></section>`;
  if (S.perfil.faltas) out += `<div class="faltas">${[["Extensão", fl.extensao], ["Atividades complementares", fl.complementares], ["Optativas", fl.optativas], ["Eletivas", fl.eletivas]]
    .map(([t, n]) => `<div class="falta"><b>${n ? "faltam " + n + " h" : "completo"}</b><span>${t}</span></div>`).join("")}</div>`;
  out += saiba("O que conta para se formar", `<ul class="info-linhas texto">
    <li><strong>Matérias obrigatórias</strong><span>As do fluxograma.</span></li>
    <li><strong>Extensão (387 h)</strong><span>Vem da carga de extensão das matérias. As que faltam já completam.</span></li>
    <li><strong>Optativas (150 h)</strong><span>Escolhidas na lista do currículo de Engenharia Química.</span></li>
    <li><strong>Eletivas (30 h)</strong><span>Matérias de fora do currículo. Horas extras de optativas contam aqui.</span></li>
    <li><strong>Atividades complementares (30 h)</strong><span>Certificados de palestras, visitas, monitoria… (aba Certificados).</span></li></ul>`,
    `Números do idUFF${S.perfil.atualizadoIduff ? ", lidos em " + esc(S.perfil.atualizadoIduff.split("-").reverse().join("/")) : ""}.`);
  out += `<div class="secao-cab" style="flex-wrap:nowrap"><div class="filtros" role="group" aria-label="Filtrar" style="flex:1 1 0;min-width:0">${[["todas", "Todas"], ["aprovado", "Aprovadas"], ["cursando", "Cursando"], ["pendente", "Faltam"]].map(([k, t]) => `<button class="filtro" data-acao="filtro" data-f="${k}" aria-pressed="${f === k}">${t}</button>`).join("")}</div><button class="btn leve" data-acao="nova-disc" aria-label="Nova matéria">${svgIco("mais")}</button></div>`;
  if (!S.discs.size) return out + `<div class="vazio">O currículo ainda não foi carregado.</div>` + rodape();
  for (const k of [...grupos.keys()].sort((a, b) => a - b)) {
    const ds = ordenarPor(grupos.get(k), (d) => d.nome);
    out += `<section class="periodo-grupo"><h2>${k === 99 ? "Optativas e outras" : k + "º período"}</h2><div class="lista">${ds.map((d) => {
      const [t, c] = SITUACOES[d.situacao] || SITUACOES.pendente;
      const equiv = /equival/i.test(d.obs || "");
      const sub = [d.cargaHoraria ? d.cargaHoraria + " h" : "", d.notaFinal != null ? "nota " + nota1(d.notaFinal) + (d.vs != null ? " (VS " + nota1(d.vs) + ")" : "") : equiv ? "por equivalência" : "", d.semestre || "", d.requisito && d.situacao !== "aprovado" ? "requer " + d.requisito : ""].filter(Boolean).join(" · ");
      return `<div class="linha clicavel" data-acao="editar-disc" data-id="${esc(d.id)}">${iconeDisc(d, true)}
        <div><div class="t">${esc(d.nome)}</div><div class="s">${esc(sub)}</div></div><span class="pilula ${c}">${t}</span></div>`; }).join("")}</div></section>`;
  }
  return out + rodape();
}

function telaEstudo() {
  const h = hojeISO();
  const todos = ordenarPor([...S.avisos.values()], (v) => v.data || "9999");
  const atras = todos.filter((v) => !v.feito && v.data && v.data < h);
  const hoje = todos.filter((v) => !v.feito && v.data === h);
  const semana = todos.filter((v) => !v.feito && v.data > h && v.data <= somaDias(h, 7));
  const depois = todos.filter((v) => !v.feito && (!v.data || v.data > somaDias(h, 7)));
  const feitos = todos.filter((v) => v.feito).reverse().slice(0, 10);
  let out = `<section class="cartao"><h2>Plano de estudo por prova</h2><p class="pequeno fraco">Escolha uma prova e o app cria revisões em dias diferentes antes dela. Elas aparecem no Início no dia certo.</p>
    <div class="acoes-folha"><button class="btn forte" data-acao="plano">Montar plano</button><button class="btn" data-acao="novo-aviso">${svgIco("mais")} Tarefa solta</button></div></section>`;
  const bloco = (t, arr) => arr.length ? `<section class="secao"><h2>${t}</h2><div class="lista">${arr.map(linhaAviso).join("")}</div></section>` : "";
  out += bloco("Atrasados", atras) + bloco("Hoje", hoje) + bloco("Próximos 7 dias", semana) + bloco("Mais adiante", depois) + bloco("Feitos", feitos);
  if (!atras.length && !hoje.length && !semana.length && !depois.length) out += `<div class="vazio">Nenhuma revisão marcada.</div>`;
  out += saiba("Como estudar melhor", `<ul class="info-linhas texto">
    ${[["Tirar da memória", "Feche o caderno e tente resolver. Errar e corrigir fixa mais que reler."], ["Espaçar", "Sessões curtas em dias diferentes rendem mais que a véspera inteira."], ["Misturar", "Alternar tipos de exercício treina a reconhecer o método certo."], ["Prova antiga", "Dois ou três dias antes, simule a prova no tempo."]].map(([t, s]) => `<li><strong>${t}</strong><span>${s}</span></li>`).join("")}</ul>`);
  return out + rodape();
}

function rodape() {
  return `<footer class="rodape-uff"><button class="btn leve" data-acao="perfil">Ajustes e cópia de segurança</button>
    <p class="rodape">App pessoal de estudo, não é sistema oficial da UFF · Versão do app: ${VERSAO_APP}</p></footer>`;
}

/* ---------- folha de edição ---------- */
const folha = $("#folha"), form = $("#folha-form");
let aoSalvar = null;
function campo(c) {
  const v = c.valor ?? "";
  const id = "f-" + c.id;
  let input;
  if (c.tipo === "select") {
    const opcao = ([k, t]) => `<option value="${esc(k)}" ${String(k) === String(v) ? "selected" : ""}>${esc(t)}</option>`;
    const grupos = [];
    for (const o of c.opcoes) { const g = o[2] || ""; if (!grupos.length || grupos.at(-1)[0] !== g) grupos.push([g, []]); grupos.at(-1)[1].push(o); }
    input = `<select id="${id}" name="${c.id}">${grupos.map(([g, os]) => g ? `<optgroup label="${esc(g)}">${os.map(opcao).join("")}</optgroup>` : os.map(opcao).join("")).join("")}</select>`;
  }
  else if (c.tipo === "file") input = `<input id="${id}" name="${c.id}" type="file" accept="${esc(c.accept || "")}">`;
  else if (c.tipo === "textarea") input = `<textarea id="${id}" name="${c.id}" placeholder="${esc(c.dica || "")}">${esc(v)}</textarea>`;
  else input = `<input id="${id}" name="${c.id}" type="${c.tipo || "text"}" value="${esc(v)}" ${c.inputmode ? `inputmode="${c.inputmode}"` : ""} placeholder="${esc(c.dica || "")}" ${c.obrig ? "required" : ""}>`;
  return `<div class="campo"><label for="${id}">${esc(c.rotulo)}</label>${input}${c.ajuda ? `<span class="ajuda">${esc(c.ajuda)}</span>` : ""}</div>`;
}
function abrirFolha({ titulo, campos, extra = "", salvar, apagar }) {
  const linhas = [];
  for (let i = 0; i < campos.length; i++) {
    const c = campos[i];
    if (c.par && campos[i + 1]) { linhas.push(`<div class="campos-2">${campo(c)}${campo(campos[i + 1])}</div>`); i++; }
    else linhas.push(campo(c));
  }
  form.innerHTML = `<h2>${esc(titulo)}</h2>${linhas.join("")}${extra}<p class="ajuda" id="folha-erro" role="alert" hidden></p>
    <div class="folha-pe">${apagar ? `<button type="button" class="btn perigo" id="folha-apagar">Apagar</button>` : ""}<div class="dir"><button type="button" class="btn" id="folha-fechar">Cancelar</button><button type="submit" class="btn forte" ${podeEscrever ? "" : "disabled"}>Salvar</button></div></div>`;
  aoSalvar = salvar;
  $("#folha-fechar").onclick = () => folha.close();
  const ap = $("#folha-apagar");
  if (ap) ap.onclick = async () => {
    if (!ap.classList.contains("armado")) { ap.classList.add("armado"); ap.textContent = "Toque de novo para apagar"; return; }
    ap.disabled = true;
    try { await apagar(); folha.close(); } catch (e) { erroFolha(e); ap.disabled = false; }
  };
  folha.showModal();
}
function erroFolha(e) { const p = $("#folha-erro"); p.hidden = false; p.style.color = "var(--rep)"; p.textContent = typeof e === "string" ? e : "Não consegui salvar agora. Confira a conexão e tente de novo."; }
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!aoSalvar) return;
  const dados = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  try { const r = await aoSalvar(dados); if (r !== false) folha.close(); }
  catch (e) { erroFolha(e); }
  finally { btn.disabled = false; }
});

const opcoesDisc = (vazio) => [...(vazio ? [["", vazio]] : []), ...ordenarPor([...S.discs.values()].filter((d) => d.situacao === "cursando"), (d) => d.nome).map((d) => [d.id, d.nome])];

        tipo: f.tipo, situacao: f.situacao, notaFinal: nf, semestre: f.semestre.trim(), professor: f.professor.trim(), turma: f.turma.trim(), horarios };
      const novoId = id || (doc.codigo || "d") .replace(/[^A-Za-z0-9_-]/g, "") + "-" + Math.random().toString(36).slice(2, 6);

function folhaAval(id, discPadrao) {
  const a = id ? S.avals.get(id) : { disciplinaId: discPadrao || "", tipo: "prova", peso: 1 };
  if (!opcoesDisc().length) { mostrarAviso("Primeiro cadastre uma matéria como “cursando” na aba Período."); return; }
  abrirFolha({

    campos: [
      { id: "disciplinaId", rotulo: "Matéria", valor: a.disciplinaId, tipo: "select", opcoes: opcoesDisc() },
      { id: "nome", rotulo: "Nome", valor: a.nome, dica: "P1, P2, Trabalho, VS…", obrig: true, par: true },
      { id: "tipo", rotulo: "Tipo", valor: a.tipo, tipo: "select", opcoes: [["prova", "Prova"], ["trabalho", "Trabalho"], ["vs", "VS (verificação suplementar)"]] },
      { id: "data", rotulo: "Data", valor: a.data, tipo: "date", par: true },

async function moverAvisosDaProva(avalId, antiga, nova) {
  const delta = diasAte(nova) - diasAte(antiga);
  for (const v of S.avisos.values()) if (v.avaliacaoId === avalId && !v.feito && v.data) await db.collection("avisos").doc(v.id).update({ data: somaDias(v.data, delta) });
}

/* ---------- certificados: os dados ficam com o resto; o PDF fica no próprio aparelho (IndexedDB) ---------- */
const idb = (() => {
  let aberto;
  const abrir = () => aberto ??= new Promise((ok, erro) => {
    const r = indexedDB.open("caderneta-uff", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("arquivos");
    r.onsuccess = () => ok(r.result);
    r.onerror = () => erro(r.error);
  });
  const usar = async (modo, fn) => {
    const banco = await abrir();
    return new Promise((ok, erro) => {
      const t = banco.transaction("arquivos", modo);
      const req = fn(t.objectStore("arquivos"));
      t.oncomplete = () => ok(req?.result);
      t.onerror = () => erro(t.error);
    });
  };
  return { get: (k) => usar("readonly", (s) => s.get(k)), set: (k, v) => usar("readwrite", (s) => s.put(v, k)), del: (k) => usar("readwrite", (s) => s.delete(k)) };
})();
const PARA = { complementares: "Atividades complementares", extensao: "Extensão", outro: "Ainda não sei" };
const tabelaHoras = () => (typeof BASE !== "undefined" && BASE.tabelaHoras) || null;
// Hora equivalente (he) de um certificado, antes do teto da categoria
function heBruta(cat, horas, quantidade) {
  if (!cat) return 0;
  const v = cat.cadaHoras ? (cat.he * (Number(horas) || 0)) / cat.cadaHoras : cat.he * (Number(quantidade) || 1);
  return Math.round(v * 10) / 10;
}
const umaCasa = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");
// Aplica o teto (Máx) de cada categoria na ordem das datas: o que passar do teto não conta
function certificadosContados() {
  const cats = tabelaHoras()?.categorias || [];
  const usado = new Map();
  const lista = ordenarPor([...S.certs.values()], (c) => c.data || "9999").map((c) => {
    const cat = cats.find((t) => t.id === c.categoria);
    if (!cats.length) return { ...c, cat: null, bruta: Number(c.horas) || 0, valida: Number(c.horas) || 0 };
    const bruta = heBruta(cat, c.horas, c.quantidade);
    let valida = bruta;
    if (cat) { const u = usado.get(cat.id) || 0; valida = Math.round(Math.max(0, Math.min(bruta, cat.max - u)) * 10) / 10; usado.set(cat.id, u + valida); }
    return { ...c, cat, bruta, valida };
  });
  for (const c of lista) if (c.cat) c.usadoCat = usado.get(c.cat.id);
  return lista;
}

async function verArquivo(id) {

      if (vez !== visorVez) return;
      const escala = (largura / pg.getViewport({ scale: 1 }).width) * Math.min(window.devicePixelRatio || 1, 2.5);
      const vp = pg.getViewport({ scale: escala });
      const cv = document.createElement("canvas");
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.setAttribute("aria-label", `Página ${n} de ${doc.numPages}`);
      caixa.append(cv);
      await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    }
  } catch {
    if (vez !== visorVez) return;
    caixa.innerHTML = `<p>Não consegui desenhar este PDF aqui.</p><p><a class="btn" href="${visorUrl}" target="_blank" rel="noopener">Abrir no leitor do celular</a></p>`;

async function importarCopia(arq) {
  let j;
  try { j = JSON.parse(await arq.text()); } catch { return `“${arq.name}” não é um arquivo da Caderneta. Escolha o arquivo que termina em .json.`; }
  if (j?.caderneta !== "uff" || typeof j.alteracoes !== "object") return `“${arq.name}” não é um arquivo da Caderneta.`;
  let n = 0;
  try {
    for (const [id, x] of Object.entries(j.arquivos || {})) {
      const bin = atob(x.dados); const bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      await idb.set(id, new Blob([bytes], { type: x.tipo }));
      n++;
    }
  } catch { return "O celular não deixou guardar os PDFs. Confira se há espaço livre e se o app não está numa aba anônima."; }
  try { await navigator.storage?.persist?.(); } catch {}
  ALT = { ...ALT, ...j.alteracoes };
  try { guardarAlt(); } catch (e) { return String(e); }
  for (const c of COLECOES) avisarMudanca(c);
  const certs = Object.keys(j.alteracoes).filter((k) => k.startsWith("certificados/")).length;
  return certs ? `Pronto: ${certs} certificado(s) entraram no app, ${n} com arquivo.` : "Cópia aberta: suas alterações voltaram para este aparelho.";
}
// Recebe um pacote trancado que o Claude põe no site (dados/entregas). O código abre o pacote; sem ele não dá.
async function receberPacote(codigo) {
  const limpo = String(codigo).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (limpo.length !== 10) return "O código tem 10 letras e números (pode digitar com ou sem o tracinho).";
  if (!crypto?.subtle) return "Este navegador não consegue abrir o pacote. Abra a Caderneta pelo endereço https://obernardodiniz.github.io/uff/.";
  const enc = new TextEncoder();
  const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("caderneta:" + limpo)))].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
  let buf;
  try {
    const r = await fetch(`dados/entregas/${hash}.bin?v=${Date.now()}`, { cache: "no-store" });
    if (r.status === 404) return "Não achei nenhum pacote com esse código. Confira as letras.";
    if (!r.ok) throw 0;
    buf = new Uint8Array(await r.arrayBuffer());
  } catch { return "Sem internet agora. Tente de novo com o celular conectado."; }
  const base = await crypto.subtle.importKey("raw", enc.encode(limpo), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let claro;
  try { claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, chave, buf.slice(28)); }
  catch { return "Código errado. Confira as letras."; }
  return importarCopia(new File([claro], "pacote.json", { type: "application/json" }));
}
